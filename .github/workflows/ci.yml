name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  content:
    name: Validate content (solutions pass, starters fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-content.txt
      - run: pip install -r scripts/requirements-content.txt
      # PyTorch exercises are validated locally (`--skip-local` keeps CI light).
      - run: python scripts/validate_content.py --skip-local
