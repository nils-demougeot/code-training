id: tfidf-search
title: Mini moteur de recherche TF-IDF
domain: ml
difficulty: medium
hours: 1.5
summary: Tokenisation, vocabulaire, matrice TF-IDF et similarité cosinus en NumPy. Puis vérification contre scikit-learn.
intro: |
  Les bases du NLP « classique » et de la recherche d'information, toujours utilisées en *retrieval* (et comme baseline des embeddings).

  `DOCS` est une liste de 12 courtes descriptions de cours. Tu vas construire un moteur qui renvoie les documents les plus pertinents pour une requête.

  Pipeline : `texte → tokens → vocabulaire → comptages (TF) → pondération IDF → normalisation L2 → similarité cosinus`.
setup: |
  import numpy as np
  DOCS = [
      "Introduction au machine learning avec Python et scikit-learn",
      "Les réseaux de neurones profonds et la rétropropagation",
      "Manipuler des données tabulaires avec pandas",
      "Statistiques descriptives et visualisation de données",
      "Apprentissage profond pour la vision par ordinateur",
      "Requêtes SQL, jointures et agrégations pour l'analyse de données",
      "Traitement automatique du langage et embeddings de mots",
      "Optimisation : descente de gradient, momentum et Adam",
      "Python avancé : générateurs, décorateurs et classes",
      "Séries temporelles et prévision des ventes",
      "Machine learning : arbres de décision et forêts aléatoires",
      "Transformers et attention pour le traitement du langage",
  ]
  STOPWORDS = {"au", "avec", "et", "les", "la", "le", "de", "des", "du", "pour", "par", "l", "d"}
starter: |
  import re
  import numpy as np


  # Étape 1
  def tokenize(text):
      pass


  # Étape 2
