id: churn-pipeline
title: "Pipeline ML de bout en bout : prédire le churn"
domain: ml
difficulty: medium
hours: 1.5
summary: Exploration, split stratifié, ColumnTransformer, pipeline, validation croisée, tuning et évaluation finale, comme dans un vrai projet.
intro: |
  Un opérateur télécom veut prédire quels clients vont résilier (`churn = 1`). Le DataFrame `df` (2 000 clients) est chargé :

  | colonne | type |
  |---|---|
  | `tenure_months`, `monthly_charges`, `support_calls` | numériques (avec des NaN) |
  | `plan`, `payment`, `region` | catégorielles (avec des NaN) |
  | `churn` | cible (0/1, ~25 % de positifs) |

  Constantes disponibles : `NUM`, `CAT`, `TARGET = 'churn'`.

  Tu vas construire le pipeline étape par étape. C'est **exactement** la structure attendue dans un exercice de take-home ML.
setup: |
  import numpy as np
  import pandas as pd
  _rng = np.random.default_rng(7)
  _n = 2000
  df = pd.DataFrame({
      'tenure_months': _rng.integers(1, 72, _n).astype(float),
      'monthly_charges': _rng.normal(55, 20, _n).clip(10, 140).round(2),
      'support_calls': _rng.poisson(1.2, _n).astype(float),
      'plan': _rng.choice(['mensuel', 'annuel', 'biannuel'], _n, p=[0.55, 0.3, 0.15]),
      'payment': _rng.choice(['carte', 'prélèvement', 'chèque'], _n, p=[0.45, 0.4, 0.15]),
      'region': _rng.choice(['Nord', 'Sud', 'Est', 'Ouest'], _n),
  })
  _logit = (-1.4 - 0.035 * (df.tenure_months - 36) + 0.02 * (df.monthly_charges - 55)
            + 0.45 * df.support_calls + (df.plan == 'mensuel') * 1.1 - (df.plan == 'biannuel') * 0.8
            + (df.payment == 'chèque') * 0.6)
  df['churn'] = (_rng.random(_n) < 1 / (1 + np.exp(-_logit))).astype(int)
  for _col, _rate in [('tenure_months', 0.04), ('monthly_charges', 0.06), ('support_calls', 0.03), ('plan', 0.05), ('payment', 0.02)]:
      df.loc[_rng.random(_n) < _rate, _col] = np.nan
  NUM = ['tenure_months', 'monthly_charges', 'support_calls']
  CAT = ['plan', 'payment', 'region']
  TARGET = 'churn'
