id: nn-from-scratch
title: Un réseau de neurones from scratch
domain: dl
difficulty: hard
hours: 2
summary: Code un MLP complet en NumPy (initialisation, forward, cross-entropy, backprop, entraînement) et fais-lui démêler trois spirales.
intro: |
  Objectif : comprendre **ce que fait vraiment** `model.fit()` ou `loss.backward()` en codant tout à la main.

  Les données : `X` (300 points en 2D) et `y` (3 classes en spirale), déjà chargées. Aucun modèle linéaire ne peut les séparer.

  Architecture : `X (n, 2) → Linear → ReLU → Linear → softmax (n, 3)`.

  Avance étape par étape. **Vérifier les étapes** lance les tests de toutes les étapes. Tu peux faire **Exécuter** à tout moment pour faire des `print(...shape)`.
setup: |
  import numpy as np
  def make_spirals(n_per_class=100, n_classes=3, seed=0):
      rng = np.random.default_rng(seed)
      X, y = [], []
      for c in range(n_classes):
          r = np.linspace(0.0, 1, n_per_class)
          t = np.linspace(c * 4, (c + 1) * 4, n_per_class) + rng.normal(0, 0.2, n_per_class)
          X.append(np.c_[r * np.sin(t), r * np.cos(t)])
          y += [c] * n_per_class
      return np.vstack(X), np.array(y)
  X, y = make_spirals()
