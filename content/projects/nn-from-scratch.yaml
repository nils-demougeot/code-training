solution: |
  import numpy as np


  def init_params(d_in, d_hidden, n_classes, seed=0):
      rng = np.random.default_rng(seed)
      return {
          'W1': rng.standard_normal((d_in, d_hidden)) * np.sqrt(2 / d_in),
          'b1': np.zeros(d_hidden),
          'W2': rng.standard_normal((d_hidden, n_classes)) * np.sqrt(2 / d_hidden),
          'b2': np.zeros(n_classes),
      }


  def forward(X, params):
      Z1 = X @ params['W1'] + params['b1']
      H = np.maximum(0, Z1)
      Z2 = H @ params['W2'] + params['b2']
      Z2 = Z2 - Z2.max(axis=1, keepdims=True)
      E = np.exp(Z2)
      P = E / E.sum(axis=1, keepdims=True)
      return P, {'X': X, 'Z1': Z1, 'H': H}


  def cross_entropy(P, y):
      n = len(y)
      return float(-np.log(np.clip(P[np.arange(n), y], 1e-12, None)).mean())


  def backward(P, y, cache, params):
      n = len(y)
      dZ2 = P.copy()
      dZ2[np.arange(n), y] -= 1
      dZ2 /= n
      dW2 = cache['H'].T @ dZ2
      db2 = dZ2.sum(axis=0)
      dH = dZ2 @ params['W2'].T
      dZ1 = dH * (cache['Z1'] > 0)
      dW1 = cache['X'].T @ dZ1
      db1 = dZ1.sum(axis=0)
      return {'W1': dW1, 'b1': db1, 'W2': dW2, 'b2': db2}


  def predict(X, params):
      return forward(X, params)[0].argmax(axis=1)


  def train(X, y, d_hidden=100, lr=1.0, epochs=3000, seed=0):
      params = init_params(X.shape[1], d_hidden, int(y.max()) + 1, seed)
      losses = []
      for _ in range(epochs):
          P, cache = forward(X, params)
          losses.append(cross_entropy(P, y))
          grads = backward(P, y, cache, params)
          for k in params:
              params[k] -= lr * grads[k]
      return params, losses
steps:
  - title: Initialiser les paramètres
    instructions: |
      Écris `init_params(d_in, d_hidden, n_classes, seed=0)` qui renvoie un **dict** :

      | clé | shape | valeur |
      |---|---|---|
      | `W1` | `(d_in, d_hidden)` | He : `rng.standard_normal(shape) * sqrt(2 / d_in)` |
      | `b1` | `(d_hidden,)` | zéros |
      | `W2` | `(d_hidden, n_classes)` | He : `* sqrt(2 / d_hidden)` |
      | `b2` | `(n_classes,)` | zéros |

      Tire `W1` **puis** `W2` avec le même `rng` (l'ordre compte pour que les valeurs soient reproductibles).
    hints:
      - "`rng.standard_normal((d_in, d_hidden)) * np.sqrt(2 / d_in)`."
      - "Pourquoi pas zéro partout ? Tous les neurones cachés recevraient le même gradient et resteraient identiques."
    tests:
      - name: Shapes
        check: |
          p = init_params(2, 16, 3)
          shapes = {k: v.shape for k, v in p.items()}
          assert shapes == {'W1': (2, 16), 'b1': (16,), 'W2': (16, 3), 'b2': (3,)}, f"shapes : {shapes}"
      - name: Valeurs reproductibles
        call: init_params(2, 4, 3, seed=1)
  - title: Forward pass
    instructions: |
      Écris `forward(X, params)` qui renvoie le tuple `(P, cache)` :

      - $Z_1 = XW_1 + b_1$, $H = \text{ReLU}(Z_1)$, $Z_2 = HW_2 + b_2$ ;
      - `P = softmax(Z2)` ligne par ligne, **stable numériquement** ;
      - `cache` : un dict `{'X': X, 'Z1': Z1, 'H': H}`, dont le backward aura besoin.
    hints:
      - "Softmax stable : soustrais `Z2.max(axis=1, keepdims=True)` avant `np.exp`."
      - "Vérifie avec Exécuter : `P, c = forward(X, init_params(2, 100, 3)); print(P.shape, P.sum(1)[:3])`."
    tests:
      - name: Probabilités valides
        check: |
          P, cache = forward(X, init_params(2, 32, 3))
          assert P.shape == (300, 3), f"shape {P.shape}"
          assert np.allclose(P.sum(axis=1), 1) and (P >= 0).all()
          assert set(cache) >= {'X', 'Z1', 'H'}, f"clés du cache : {set(cache)}"
      - name: Valeurs exactes
        call: forward(X[:5], init_params(2, 8, 3))[0]
  - title: Cross-entropy
    instructions: |
      Écris `cross_entropy(P, y)` : la moyenne de $-\log P_{i, y_i}$ (un float).

      Test de sanité : à l'initialisation, avec 3 classes, la loss doit valoir environ $\ln 3 ≈ 1{,}1$.
    hints:
      - "`P[np.arange(len(y)), y]` sélectionne la probabilité de la bonne classe pour chaque ligne."
      - "Protège-toi de `log(0)` avec `np.clip(..., 1e-12, None)`."
    tests:
      - call: cross_entropy(np.array([[0.7, 0.2, 0.1], [0.1, 0.1, 0.8]]), np.array([0, 2]))
        expected: "0.2899092476264711"
      - name: Proche de ln(3) à l'initialisation
        check: |
          P, _ = forward(X, init_params(2, 100, 3))
          loss = cross_entropy(P, y)
          assert 0.8 < loss < 1.6, f"loss initiale {loss:.3f}, attendu ≈ 1.1"
  - title: Backpropagation
    instructions: |
      Écris `backward(P, y, cache, params)` qui renvoie le dict des gradients `{'W1', 'b1', 'W2', 'b2'}` (mêmes shapes que les paramètres) :

      1. `dZ2 = (P - onehot(y)) / n`
      2. `dW2 = H.T @ dZ2`, `db2 = dZ2.sum(0)`
      3. `dH = dZ2 @ W2.T`, `dZ1 = dH * (Z1 > 0)`
      4. `dW1 = X.T @ dZ1`, `db1 = dZ1.sum(0)`

      Le test compare tes gradients à un **gradient numérique** : c'est ainsi qu'on débogue un backprop.
    hints:
      - "Ne modifie pas `P` en place : commence par `dZ2 = P.copy()`, puis `dZ2[np.arange(n), y] -= 1`."
      - "Règle d'or : le gradient a toujours la shape du paramètre. `dW2` doit être `(hidden, 3)`."
    tests:
      - name: Shapes
        check: |
          params = init_params(2, 10, 3)
          P, cache = forward(X, params)
          g = backward(P, y, cache, params)
          for k in params:
              assert g[k].shape == params[k].shape, f"grads['{k}'] : {g[k].shape} ≠ {params[k].shape}"
      - name: Gradient check numérique
        check: |
          params = init_params(2, 6, 3, seed=3)
          Xs, ys = X[7::30], y[7::30]
          P, cache = forward(Xs, params)
          g = backward(P, ys, cache, params)
          h = 1e-5
          for k in ['W1', 'b1', 'W2', 'b2']:
              num = np.zeros_like(params[k])
              for idx in np.ndindex(params[k].shape):
                  old = params[k][idx]
                  params[k][idx] = old + h
                  lp = cross_entropy(forward(Xs, params)[0], ys)
                  params[k][idx] = old - h
                  lm = cross_entropy(forward(Xs, params)[0], ys)
                  params[k][idx] = old
                  num[idx] = (lp - lm) / (2 * h)
              assert np.allclose(g[k], num, atol=1e-5), f"grads['{k}'] ne correspond pas au gradient numérique"
  - title: Entraîner et prédire
    instructions: |
      1. `predict(X, params)` : la classe la plus probable de chaque point.
      2. `train(X, y, d_hidden=100, lr=1.0, epochs=3000, seed=0)` : initialise, puis à chaque époque fait forward → loss (ajoutée à `losses`) → backward → mise à jour `param -= lr * grad`. Renvoie `(params, losses)`.

      Objectif : plus de **95 % d'accuracy** sur les spirales. Essaie ensuite `d_hidden=3` : que se passe-t-il ?
    hints:
      - "`for k in params: params[k] -= lr * grads[k]`."
      - "Si la loss stagne autour de 1,1 : vérifie le signe de la mise à jour et le gradient check de l'étape 4."
    tests:
      - name: Accuracy > 95 %
        check: |
          params, losses = train(X, y)
          acc = (predict(X, params) == y).mean()
          assert acc > 0.95, f"accuracy {acc:.1%}"
          assert len(losses) == 3000 and losses[-1] < losses[0] / 5, f"loss {losses[0]:.3f} → {losses[-1]:.3f}"
      - name: Petit entraînement exact
        call: train(X, y, d_hidden=8, lr=0.5, epochs=20)[1]
outro: |
  Tu viens de coder ce que fait un framework de deep learning. Pour aller plus loin :

  - Remplace la descente de gradient par **mini-batch SGD** puis **Adam** (exercice *Implémenter SGD momentum et Adam*).
  - Ajoute une seconde couche cachée : seul `forward`/`backward` changent, la boucle reste la même.
  - Joue avec le lab **Réseau de neurones : large ou profond ?** pour voir ces mêmes mécanismes en direct.
  - En PyTorch, `forward` est ta méthode `forward`, et `backward` est fait **automatiquement** par `loss.backward()` (autograd).
