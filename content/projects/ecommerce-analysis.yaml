id: ecommerce-analysis
title: "Analyse e-commerce : KPIs, cohortes et segmentation RFM"
domain: pandas
difficulty: medium
hours: 1
shared: shop_df
summary: Le cas pratique data analyst classique. KPIs, rapport mensuel, segmentation RFM des clients et analyse de Pareto des produits.
intro: |
  Tu reçois l'export des commandes d'une boutique en ligne (`orders`, 500 commandes sur 6 mois) :
  `order_id, date, customer, city, product, category, qty, price`.

  Le CEO veut un point sur l'activité. Tu vas produire, étape par étape, les tableaux d'une analyse complète. Le code reste dans un seul fichier, comme dans un notebook bien rangé.
setup: |
  import numpy as np
  orders = make_orders(500, seed=21)
  REF_DATE = pd.Timestamp('2024-07-01')
