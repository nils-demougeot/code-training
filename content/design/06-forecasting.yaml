id: forecasting
title: Prévoir la demande pour réapprovisionner des magasins
company: Une chaîne de supermarchés (300 magasins, 20 000 produits)
difficulty: medium
minutes: 30
summary: Séries temporelles à grande échelle. Validation temporelle, hiérarchie, promotions, ruptures de stock et décision sous incertitude.
context: |
  La chaîne veut prévoir les **ventes de chaque produit dans chaque magasin pour les 14 prochains jours**, afin de passer les commandes aux fournisseurs. Trop de stock : du gaspillage (produits frais). Pas assez : des ruptures et des ventes perdues.
steps:
  - id: framing
    title: Cadrage et métriques
    question: Que prévoit-on exactement et comment juger la qualité de la prévision ?
    points:
      - "Prévoir la **demande** (pas seulement les ventes observées) par produit × magasin × jour, sur 14 jours"
      - "Prévision **probabiliste** (quantiles) car la décision de commande dépend de l'incertitude"
      - "Métriques : WAPE / MAE pondérées par le volume ; pinball loss pour les quantiles"
      - "Métriques business : taux de rupture, gaspillage, valeur du stock"
      - "Comparer à une baseline naïve (même jour la semaine précédente)"
    answer: |
      La cible est la **demande** jour × magasin × produit sur 14 jours. On produit des **quantiles** : la quantité à commander dépend du coût d'une rupture (ventes perdues) et du coût d'un invendu (gaspillage, surtout pour le frais). C'est le problème du « vendeur de journaux » : on commande au quantile `coût_rupture / (coût_rupture + coût_invendu)`.

      Métriques : **WAPE** (erreur absolue totale / ventes totales, robuste aux nombreux produits à faible volume ; le MAPE explose sur les zéros), pinball loss. Business : ruptures, gaspillage. Baseline : ventes du même jour la semaine précédente.
  - id: data
    title: Données et pièges
    question: Quelles données utilises-tu et quels pièges spécifiques aux séries temporelles anticipes-tu ?
    points:
      - "Historique de ventes, prix, **promotions**, jours fériés, météo, événements locaux"
      - "**Ventes censurées** : pendant une rupture, les ventes valent 0 mais la demande n'était pas nulle"
      - "Validation **temporelle** (backtesting sur plusieurs fenêtres glissantes), jamais de split aléatoire"
      - "Pas de fuite du futur : les features doivent être connues au moment de la prévision (prix futurs planifiés oui, ventes futures non)"
      - "Nouveaux produits et nouveaux magasins sans historique (cold start)"
    answer: |
      - Sources : ventes, prix, **calendrier promotionnel**, jours fériés et vacances, météo, événements, ouvertures/fermetures.
      - **Censure** : un jour de rupture, on observe 0 vente alors que la demande existait. Il faut marquer ces jours (stock à 0) et les exclure ou les corriger, sinon le modèle apprend à sous-prévoir… ce qui crée plus de ruptures.
      - **Backtesting** : on simule plusieurs dates de prévision passées (fenêtres glissantes) et on mesure l'erreur sur les 14 jours suivants à chaque fois.
      - Seules les informations **connues à la date de prévision** entrent dans les features (promotions planifiées : oui ; ventes réelles de la semaine prochaine : évidemment non).
  - id: features
    title: Features et modèle
    question: Quelle approche de modélisation choisis-tu pour 6 millions de séries ?
    points:
      - "Un modèle **global** (gradient boosting) entraîné sur toutes les séries, plutôt qu'un modèle par série"
      - "Features de lag et de fenêtres (ventes j−7, j−14, moyennes mobiles), calendrier, prix relatif, promotions"
      - "Identifiants et caractéristiques produit / magasin (catégorie, taille du magasin, région)"
      - "Baselines : naïve saisonnière, moyenne mobile, modèles statistiques (ETS) pour comparer"
      - "Gérer la demande intermittente (beaucoup de zéros) : loss adaptée (Tweedie / Poisson)"
    answer: |
      Un modèle ARIMA par série est ingérable à 6 millions de séries et ne partage aucune information. On entraîne un **modèle global** (LightGBM) sur toutes les lignes produit × magasin × jour, avec :
      - lags et fenêtres glissantes (j−7, j−14, moyenne 28 jours), en respectant l'horizon (pour prévoir J+10, pas de lag j−1) ;
      - calendrier (jour de semaine, fériés, paie), prix et remise, promotions ;
      - attributs produit / magasin (catégorie, région, taille), qui permettent aussi de prévoir les nouveaux produits.

      Loss **Tweedie** ou Poisson pour les ventes intermittentes avec beaucoup de zéros, ou loss quantile pour des prévisions probabilistes. Comparer systématiquement à la baseline naïve saisonnière.
  - id: evaluation
    title: Évaluation
    question: Comment valides-tu le système de bout en bout ?
    points:
      - "Backtesting sur plusieurs périodes (dont les fêtes et les promotions)"
      - "Erreur par segment : frais vs sec, fortes vs faibles ventes, nouveaux produits"
      - "Simulation de la politique de commande : ruptures et gaspillage obtenus avec les prévisions"
      - "Pilote sur quelques magasins avant généralisation (comparaison avec des magasins témoins)"
      - "Vérifier la calibration des quantiles"
    answer: |
      - Backtests sur de nombreuses dates, en incluant les périodes difficiles (Noël, promotions, canicule).
      - Erreur par segment : les produits frais et les petits volumes sont les plus durs ; les nouveaux produits aussi.
      - La prévision n'est qu'une entrée : on **simule la politique de commande** (contraintes de colisage, délais fournisseurs) et on mesure ruptures et gaspillage.
      - Pilote sur une vingtaine de magasins comparés à des magasins témoins similaires, avant de généraliser.
  - id: production
    title: Production et monitoring
    question: Comment industrialiser et surveiller ces prévisions ?
    points:
      - "Pipeline batch quotidien (nuit) : données → features → prévisions → commandes"
      - "Contrôles de qualité des données en entrée (ventes manquantes d'un magasin, prix aberrants)"
      - "Monitoring de l'erreur par segment et alertes sur dérive (nouveau comportement, crise)"
      - "Interface pour que les équipes ajustent les prévisions (événement local connu) et tracer ces ajustements"
      - "Ré-entraînement régulier ; gestion des chocs (ex. confinement) par intervention humaine"
    answer: |
      - Pipeline **batch nocturne** orchestré : ingestion, contrôles de qualité (un magasin sans ventes remontées ne doit pas produire une prévision à 0), features, prévisions, propositions de commande.
      - **Monitoring** de la WAPE par segment, alertes de dérive. Lors d'un choc (crise sanitaire, grève), l'historique ne reflète plus la demande : intervention humaine et features de régime.
      - Les acheteurs peuvent **ajuster** (événement local connu) ; on mesure si leurs ajustements améliorent ou dégradent la prévision.
      - Ré-entraînement hebdomadaire, et backtests automatiques avant chaque mise en production d'un nouveau modèle.
