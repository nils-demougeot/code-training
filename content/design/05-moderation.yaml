id: moderation
title: Modérer les commentaires toxiques
company: Un réseau social (5 millions de commentaires par jour)
difficulty: medium
minutes: 30
summary: NLP en production. Définir la politique avant le modèle, gérer l'ambiguïté des labels, les biais et la boucle avec les modérateurs humains.
context: |
  La plateforme veut **détecter les commentaires toxiques** (harcèlement, insultes, menaces) pour les masquer ou les envoyer à des modérateurs humains. L'équipe de modération peut examiner 20 000 commentaires par jour.

  La plateforme est multilingue (français, anglais, espagnol) et les utilisateurs inventent sans cesse des contournements (« c0nn@rd »).
steps:
  - id: framing
    title: Cadrage et métriques
    question: Comment cadrer le problème et le mesurer ?
    points:
      - "D'abord une **politique de contenu** claire (catégories, exemples) : le modèle ne peut pas être meilleur que la définition"
      - "Multi-label par catégorie (insulte, menace, haine, spam) avec des actions différentes par niveau de gravité"
      - "Trois zones : suppression auto (très haute confiance), revue humaine (incertain), publication"
      - "Métriques : precision de la suppression automatique, recall des contenus graves, charge de la file humaine"
      - "Mesurer aussi les **faux positifs par groupe** (biais envers certains dialectes ou identités)"
    answer: |
      Avant tout modèle : une **politique** écrite, avec catégories et exemples limites, car « toxique » est ambigu.

      Formulation **multi-label** (insulte, menace, discours haineux, spam), et une politique d'action par gravité : suppression automatique si le score est très élevé (precision ≥ 99 % exigée), file de revue humaine pour la zone grise (dimensionnée à 20 000/jour), publication sinon.

      Métriques : precision des suppressions automatiques, recall sur les catégories graves (menaces), volume envoyé aux humains, et **taux de faux positifs par sous-groupe** pour détecter les biais.
  - id: data
    title: Données et labels
    question: Comment obtiens-tu des labels de qualité ?
    points:
      - "Annotation par plusieurs personnes et mesure de l'**accord inter-annotateurs**"
      - "Guide d'annotation détaillé, cas limites, ré-annotation des désaccords"
      - "Échantillonnage intelligent : on n'annote pas au hasard (99 % de contenus sains), on cible les cas incertains (active learning)"
      - "Les décisions des modérateurs comme labels, en tenant compte de leur biais de sélection"
      - "Données de toutes les langues et de plusieurs communautés pour limiter les biais"
    answer: |
      - Chaque exemple est annoté par 3 personnes ; l'**accord** (kappa) mesure l'ambiguïté. Les exemples à fort désaccord nourrissent le guide d'annotation.
      - Échantillonner au hasard gaspille le budget (contenus toxiques rares). On utilise l'**active learning** : annoter en priorité ce sur quoi le modèle hésite, plus des échantillons signalés par les utilisateurs.
      - Les décisions des modérateurs fournissent un flux continu de labels, mais seulement sur ce que le système leur envoie (biais de sélection) : on garde un petit échantillon aléatoire annoté.
      - Couvrir les langues, dialectes et communautés pour éviter qu'un modèle juge « toxique » un dialecte ou la mention d'une identité.
  - id: features
    title: Modèle
    question: Quel modèle choisirais-tu, et comment gères-tu les contournements ?
    points:
      - "Baseline : TF-IDF + régression logistique (rapide, interprétable)"
      - "Modèle principal : **transformer multilingue** pré-entraîné (fine-tuné), éventuellement distillé pour la latence"
      - "Robustesse aux contournements : tokenisation en sous-mots / caractères, normalisation (c0nn@rd → connard), augmentation de données"
      - "Contexte : le commentaire parent, l'historique de l'auteur, les signalements"
      - "Calibration des scores par catégorie pour régler les seuils"
    answer: |
      - **Baseline** TF-IDF (mots + n-grammes de caractères) + régression logistique : rapide et solide, utile pour comparer.
      - **Modèle principal** : transformer multilingue fine-tuné (type XLM-R), éventuellement **distillé** vers un modèle plus petit pour tenir 5 millions de commentaires par jour.
      - Contournements : normalisation des caractères, tokenisation en sous-mots, augmentation avec des variantes obfusquées.
      - Le texte seul ne suffit pas toujours : contexte du fil, signalements, historique de l'auteur. Les scores sont calibrés par catégorie pour fixer des seuils fiables.
  - id: evaluation
    title: Évaluation et équité
    question: Comment évalues-tu le système, au-delà d'un score global ?
    points:
      - "Jeu de test annoté de façon fiable et représentative (incluant les cas difficiles)"
      - "Precision / recall par catégorie et par langue"
      - "Tests d'**équité** : faux positifs sur des phrases neutres mentionnant des identités (jeux de tests synthétiques)"
      - "Tests de robustesse : orthographes alternatives, ironie, citations"
      - "Online : appels des utilisateurs, accord des modérateurs avec le modèle, exposition aux contenus toxiques"
    answer: |
      - Precision/recall **par catégorie et par langue** sur un jeu de test fiable (annotations consolidées).
      - **Équité** : jeux de tests synthétiques (« Je suis musulman / gay / juif ») qui doivent être classés non toxiques. Un modèle qui associe une identité à la toxicité censure les personnes qu'il est censé protéger.
      - **Robustesse** : variantes orthographiques, ironie, citations de propos toxiques pour les dénoncer.
      - Online : taux d'appels acceptés (faux positifs), accord des modérateurs avec les décisions du modèle, prévalence des contenus toxiques vus par les utilisateurs (mesurée par échantillonnage).
  - id: production
    title: Production et boucle humaine
    question: Comment le système fonctionne-t-il au quotidien ?
    points:
      - "Inférence à la publication (synchrone pour les cas graves, asynchrone sinon)"
      - "File de revue priorisée par gravité et viralité"
      - "Les décisions humaines ré-entraînent le modèle (boucle d'apprentissage continue)"
      - "Monitoring du drift : nouveaux mots, nouveaux contournements, actualité"
      - "Bien-être des modérateurs et processus d'appel pour les utilisateurs"
    answer: |
      - Score calculé à la publication ; les contenus probablement graves sont retenus avant publication, les autres traités en asynchrone.
      - File de revue **priorisée** par gravité × audience (un commentaire viral passe en premier).
      - Les décisions des modérateurs reviennent en données d'entraînement : ré-entraînement régulier, et règles rapides pour les nouveaux contournements.
      - Drift très rapide (actualité, nouveaux codes) : surveiller les termes émergents dans les signalements.
      - Côté humain : processus d'appel pour les utilisateurs et protection des modérateurs (floutage, rotation).
