id: np-patches
title: Découper une image en patches (ViT)
domain: numpy
difficulty: hard
minutes: 12
interview: true
tags: [reshape, transpose, vision transformer, axes]
statement: |
  Un **Vision Transformer** découpe une image en petits carrés (patches) qu'il traite comme des mots.

  Écris `patchify(img, p)` : `img` a la shape `(H, W, C)` avec `H` et `W` multiples de `p`. Renvoie un tableau de shape `(n_patches, p * p * C)` où :

  - les patches sont numérotés **ligne par ligne** (de gauche à droite, puis de haut en bas) ;
  - chaque patch est aplati dans l'ordre `(ligne dans le patch, colonne dans le patch, canal)`.

  Puis `unpatchify(patches, H, W, p)` : l'opération inverse.

  Sans boucle Python : uniquement `reshape` et `transpose`.
setup: |
  import numpy as np
  IMG = np.arange(4 * 6 * 2).reshape(4, 6, 2)
starter: |
  import numpy as np


  def patchify(img, p):
      pass


  def unpatchify(patches, H, W, p):
      pass
solution: |
  import numpy as np


  def patchify(img, p):
      H, W, C = img.shape
      x = img.reshape(H // p, p, W // p, p, C)
      x = x.transpose(0, 2, 1, 3, 4)
      return x.reshape(-1, p * p * C)


  def unpatchify(patches, H, W, p):
      C = patches.shape[1] // (p * p)
      x = patches.reshape(H // p, W // p, p, p, C)
      x = x.transpose(0, 2, 1, 3, 4)
      return x.reshape(H, W, C)
tests:
  - name: Shape
    call: patchify(IMG, 2).shape
    expected: "(6, 8)"
  - name: Premier patch = coin haut gauche
    call: patchify(IMG, 2)[0]
    expected: IMG[:2, :2].reshape(-1)
  - name: Deuxième patch = juste à droite
    call: patchify(IMG, 2)[1]
    expected: IMG[:2, 2:4].reshape(-1)
  - name: Quatrième patch = début de la deuxième rangée
    call: patchify(IMG, 2)[3]
    expected: IMG[2:4, :2].reshape(-1)
  - name: Comparé à une version avec boucles
    check: |
      rng = np.random.default_rng(0)
      img = rng.normal(size=(12, 8, 3))
      p = 4
      ref = np.stack([img[i:i + p, j:j + p].reshape(-1) for i in range(0, 12, p) for j in range(0, 8, p)])
      assert np.array_equal(patchify(img, p), ref)
  - name: Aller-retour
    check: |
      img = np.random.default_rng(1).normal(size=(8, 12, 3))
      assert np.array_equal(unpatchify(patchify(img, 4), 8, 12, 4), img)
wrong:
  - |
    import numpy as np


    def patchify(img, p):
        H, W, C = img.shape
        return img.reshape(-1, p * p * C)


    def unpatchify(patches, H, W, p):
        return patches.reshape(H, W, -1)
  - |
    import numpy as np


    def patchify(img, p):
        H, W, C = img.shape
        x = img.reshape(H // p, p, W // p, p, C)
        x = x.transpose(2, 0, 1, 3, 4)
        return x.reshape(-1, p * p * C)


    def unpatchify(patches, H, W, p):
        C = patches.shape[1] // (p * p)
        x = patches.reshape(W // p, H // p, p, p, C)
        x = x.transpose(1, 2, 0, 3, 4)
        return x.reshape(H, W, C)
parsons:
  distractors:
    - line: "x = x.transpose(0, 1, 2, 3, 4)"
      replaces: "x = x.transpose(0, 2, 1, 3, 4)"
    - line: "x = img.reshape(H // p, W // p, p, p, C)"
      replaces: "x = img.reshape(H // p, p, W // p, p, C)"
hints:
  - "Commence par séparer chaque axe spatial en deux : `(H, W, C)` → `(H/p, p, W/p, p, C)`."
  - "Les axes sont alors `(rangée de patch, ligne dans le patch, colonne de patch, colonne dans le patch, canal)`. Regroupe les deux axes « quel patch » devant : `transpose(0, 2, 1, 3, 4)`."
  - "Un simple `reshape` sans `transpose` mélange les lignes de patches voisins."
explanation: |
  ```python
  x = img.reshape(H // p, p, W // p, p, C)   # découpe chaque axe
  x = x.transpose(0, 2, 1, 3, 4)             # (patch_i, patch_j, i, j, c)
  x.reshape(-1, p * p * C)
  ```
  - `reshape` ne déplace jamais les données : il relit la mémoire dans le même ordre. Pour **changer l'ordre** des éléments, il faut `transpose` (puis `reshape`).
  - Méthode générale : 1. découper les axes, 2. réordonner les axes, 3. fusionner. C'est ce que fait `einops.rearrange(img, '(h p1) (w p2) c -> (h w) (p1 p2 c)', p1=p, p2=p)`.
