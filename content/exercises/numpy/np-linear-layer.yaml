id: np-linear-layer
title: Une couche dense en NumPy
domain: numpy
difficulty: easy
minutes: 5
tags: ["@", matmul, shapes, ReLU]
cards: [np-matmul, np-maximum]
statement: |
  Une couche dense calcule $Y = \text{ReLU}(XW + b)$ où :

  - `X` : batch d'entrées, shape `(n, d_in)`
  - `W` : poids, shape `(d_in, d_out)`
  - `b` : biais, shape `(d_out,)`

  Écris `dense(X, W, b)` qui renvoie `Y` de shape `(n, d_out)`, puis `mlp(X, params)` qui enchaîne les couches de la liste `params = [(W1, b1), (W2, b2), ...]` (ReLU après chaque couche **sauf la dernière**).
starter: |
  import numpy as np


  def dense(X, W, b):
      pass


  def mlp(X, params):
      pass
solution: |
  import numpy as np


  def dense(X, W, b):
      return np.maximum(0, X @ W + b)


  def mlp(X, params):
      for W, b in params[:-1]:
          X = dense(X, W, b)
      W, b = params[-1]
      return X @ W + b
setup: |
  import numpy as np
  X = np.array([[1., -1.], [2., 0.5]])
  W = np.array([[1., 0., -1.], [0., 2., 1.]])
  b = np.array([0., 1., 0.])
tests:
  - call: dense(X, W, b)
    expected: np.array([[1., 0., 0.], [2., 2., 0.]])
  - name: Shapes d'un MLP 4 → 8 → 3
    check: |
      rng = np.random.default_rng(0)
      params = [(rng.normal(size=(4, 8)), np.zeros(8)), (rng.normal(size=(8, 3)), np.zeros(3))]
      out = mlp(rng.normal(size=(5, 4)), params)
      assert out.shape == (5, 3), f"shape {getattr(out, 'shape', None)}"
  - name: Pas de ReLU sur la dernière couche
    call: "mlp(X, [(W, b), (np.array([[1.], [-1.], [1.]]), np.array([-5.]))])"
  - name: 3 couches et biais non nuls
    check: |
      rng = np.random.default_rng(7)
      params = [(rng.normal(size=(3, 5)), rng.normal(size=5)), (rng.normal(size=(5, 4)), rng.normal(size=4)), (rng.normal(size=(4, 2)), rng.normal(size=2))]
      Xr = rng.normal(size=(6, 3))
      h = np.maximum(0, Xr @ params[0][0] + params[0][1])
      h = np.maximum(0, h @ params[1][0] + params[1][1])
      assert np.allclose(mlp(Xr, params), h @ params[2][0] + params[2][1])
hints:
  - "`X @ W` : `(n, d_in) @ (d_in, d_out)` → `(n, d_out)`. Le biais `(d_out,)` se broadcast sur les lignes."
  - "ReLU : `np.maximum(0, Z)` (et non `np.max`, qui réduit)."
explanation: |
  ```python
  Z = X @ W + b          # (n, d_in) @ (d_in, d_out) + (d_out,) -> (n, d_out)
  A = np.maximum(0, Z)   # ReLU élément par élément
  ```
  - `np.max(a)` **réduit** (renvoie le max), `np.maximum(a, b)` compare **élément par élément**.
  - `@` = `np.matmul`. `*` = produit **élément par élément**.
  - Nombre de paramètres d'une couche : `d_in * d_out + d_out`.
  - En PyTorch, `nn.Linear(d_in, d_out)` stocke `W` transposé, de shape `(d_out, d_in)`, et calcule `X @ W.T + b`.
