id: np-confusion-matrix
title: Matrice de confusion vectorisée
domain: numpy
difficulty: medium
minutes: 8
interview: true
tags: [bincount, np.add.at, indexation, métriques]
statement: |
  1. `confusion_matrix(y_true, y_pred, n_classes)` : la matrice `C` de shape `(n_classes, n_classes)` où `C[i, j]` est le nombre d'échantillons de **vraie classe i** prédits en **classe j**. Entiers, sans boucle Python sur les échantillons.
  2. `per_class_recall(C)` : le recall de chaque classe, `C[i, i] / (nombre d'échantillons de vraie classe i)`. Une classe absente a un recall de `0.0`.
setup: |
  import numpy as np
  Y_TRUE = np.array([0, 0, 1, 1, 1, 2, 2, 2, 2])
  Y_PRED = np.array([0, 1, 1, 1, 0, 2, 2, 1, 2])
starter: |
  import numpy as np


  def confusion_matrix(y_true, y_pred, n_classes):
      pass


  def per_class_recall(C):
      pass
solution: |
  import numpy as np


  def confusion_matrix(y_true, y_pred, n_classes):
      flat = y_true * n_classes + y_pred
      return np.bincount(flat, minlength=n_classes ** 2).reshape(n_classes, n_classes)


  def per_class_recall(C):
      support = C.sum(axis=1)
      return np.divide(np.diag(C), support, out=np.zeros(len(C)), where=support > 0)
tests:
  - call: confusion_matrix(Y_TRUE, Y_PRED, 3)
    expected: np.array([[1, 1, 0], [1, 2, 0], [0, 1, 3]])
  - call: confusion_matrix(np.array([1, 1]), np.array([1, 1]), 3)
  - call: per_class_recall(confusion_matrix(Y_TRUE, Y_PRED, 3))
    expected: np.array([0.5, 2 / 3, 0.75])
  - name: Classe absente → recall 0
    call: "per_class_recall(np.array([[2, 0, 0], [0, 0, 0], [1, 0, 1]]))"
    expected: np.array([1.0, 0.0, 0.5])
  - name: Comparé à scikit-learn
    check: |
      from sklearn.metrics import confusion_matrix as sk_cm, recall_score
      rng = np.random.default_rng(1)
      yt, yp = rng.integers(0, 4, 500), rng.integers(0, 4, 500)
      C = confusion_matrix(yt, yp, 4)
      assert np.array_equal(C, sk_cm(yt, yp, labels=range(4)))
      assert np.allclose(per_class_recall(C), recall_score(yt, yp, average=None))
  - name: Classe avec un seul exemple
    call: "per_class_recall(np.array([[1, 0], [1, 1]]))"
    expected: np.array([1.0, 0.5])
wrong:
  - |
    import numpy as np


    def confusion_matrix(y_true, y_pred, n_classes):
        flat = y_pred * n_classes + y_true
        return np.bincount(flat, minlength=n_classes ** 2).reshape(n_classes, n_classes)


    def per_class_recall(C):
        return np.diag(C) / C.sum(axis=0)
  - |
    import numpy as np


    def confusion_matrix(y_true, y_pred, n_classes):
        C = np.zeros((n_classes, n_classes), dtype=int)
        C[y_true, y_pred] += 1
        return C


    def per_class_recall(C):
        support = C.sum(axis=1)
        return np.divide(np.diag(C), support, out=np.zeros(len(C)), where=support > 0)
parsons:
  distractors:
    - line: "support = C.sum(axis=0)"
      replaces: "support = C.sum(axis=1)"
    - line: "flat = y_pred * n_classes + y_true"
      replaces: "flat = y_true * n_classes + y_pred"
hints:
  - "Encode chaque couple `(vrai, prédit)` en un seul entier `vrai * n + prédit`, puis compte avec `np.bincount(..., minlength=n * n)`."
  - "`C[y_true, y_pred] += 1` ne marche pas : avec des indices répétés, chaque case n'est incrémentée qu'une fois. `np.add.at(C, (y_true, y_pred), 1)` gère les doublons."
  - "Recall de la classe i : diagonale divisée par la somme de la **ligne** i."
explanation: |
  - Astuce d'encodage : `i * n + j` transforme une paire en indice unique → un seul `bincount`.
  - ⚠️ `C[idx] += 1` avec des indices dupliqués est **bufferisé** : chaque position n'est incrémentée qu'une fois. `np.add.at` est la version non bufferisée.
  - Lignes = vérité, colonnes = prédiction (convention scikit-learn). Recall = diagonale / somme des lignes, precision = diagonale / somme des colonnes.
  - `np.divide(..., where=...)` évite la division par zéro sans warning.
