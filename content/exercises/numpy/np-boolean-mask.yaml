id: np-boolean-mask
title: Masques booléens
domain: numpy
difficulty: easy
minutes: 5
tags: [masque, where, vectorisation]
cards: [np-mask, np-where, np-and-mask]
statement: |
  Sans boucle :

  1. `positive_mean(a)` : moyenne des valeurs **strictement positives** de `a` (renvoie `0.0` s'il n'y en a aucune).
  2. `clip_outliers(a, low, high)` : renvoie une copie où les valeurs `< low` deviennent `low` et `> high` deviennent `high`.
  3. `count_between(a, low, high)` : nombre de valeurs dans l'intervalle **[low, high]**.
starter: |
  import numpy as np


  def positive_mean(a):
      pass


  def clip_outliers(a, low, high):
      pass


  def count_between(a, low, high):
      pass
solution: |
  import numpy as np


  def positive_mean(a):
      pos = a[a > 0]
      return float(pos.mean()) if pos.size else 0.0


  def clip_outliers(a, low, high):
      return np.clip(a, low, high)


  def count_between(a, low, high):
      return int(((a >= low) & (a <= high)).sum())
tests:
  - call: positive_mean(np.array([-1., 2., 4., 0.]))
    expected: "3.0"
  - call: positive_mean(np.array([-1, -2]))
    expected: "0.0"
  - call: clip_outliers(np.array([-5, 0, 3, 12]), 0, 10)
    expected: np.array([0, 0, 3, 10])
  - call: count_between(np.array([1, 5, 7, 10, 11]), 5, 10)
    expected: "3"
  - call: count_between(np.arange(100).reshape(10, 10), 25, 74)
    hidden: true
  - name: clip_outliers ne modifie pas l'entrée
    check: |
      a = np.array([-5, 20])
      clip_outliers(a, 0, 10)
      assert a.tolist() == [-5, 20], "l'entrée a été modifiée"
hints:
  - "`a > 0` donne un tableau de booléens ; `a[a > 0]` garde les valeurs où c'est True."
  - "Combiner deux conditions : `(a >= low) & (a <= high)` avec **les parenthèses** (pas `and`)."
  - "`True` compte comme 1 : `mask.sum()` compte les True."
explanation: |
  ```python
  a[a > 0]                         # filtrage
  a[(a > 0) & (a < 10)]            # ET  (| pour OU, ~ pour NON)
  np.where(a > 0, a, 0)            # if/else élément par élément
  np.clip(a, 0, 10)                # borner
  (a > 0).sum(), (a > 0).mean()    # nombre et proportion
  ```
  - `and`/`or` sur des tableaux lèvent `ValueError: The truth value of an array ... is ambiguous`.
  - Les parenthèses sont obligatoires : `&` est prioritaire sur `>`.
