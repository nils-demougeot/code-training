id: np-normalize-rows
title: Normaliser les lignes (norme L2)
domain: numpy
difficulty: easy
minutes: 5
tags: [axis, keepdims, broadcasting, linalg.norm]
cards: [np-norm-axis, np-keepdims]
statement: |
  Écris `normalize_rows(X)` qui divise chaque ligne de `X` (shape `(n, d)`) par sa **norme euclidienne**, pour que chaque ligne ait une norme de 1.

  Une ligne de zéros doit rester une ligne de zéros (pas de `nan`).

  C'est l'étape préalable à une **similarité cosinus** (embeddings, recherche sémantique).
starter: |
  import numpy as np


  def normalize_rows(X):
      pass
solution: |
  import numpy as np


  def normalize_rows(X):
      norms = np.linalg.norm(X, axis=1, keepdims=True)  # (n, 1)
      norms[norms == 0] = 1.0
      return X / norms
tests:
  - call: normalize_rows(np.array([[3., 4.], [1., 0.]]))
    expected: np.array([[0.6, 0.8], [1., 0.]])
  - name: Ligne nulle
    call: normalize_rows(np.array([[0., 0.], [0., 2.]]))
    expected: np.array([[0., 0.], [0., 1.]])
  - call: normalize_rows(np.arange(12, dtype=float).reshape(4, 3))
    hidden: true
  - name: Chaque ligne a une norme 1
    check: |
      rng = np.random.default_rng(0)
      out = normalize_rows(rng.normal(size=(50, 8)))
      assert out.shape == (50, 8), f"shape {out.shape}"
      assert np.allclose(np.linalg.norm(out, axis=1), 1)
hints:
  - "`np.linalg.norm(X, axis=1)` donne la norme de chaque ligne, shape `(n,)`."
  - "`(n, d) / (n,)` ne broadcast pas ! Il faut `(n, 1)` : `keepdims=True`."
explanation: |
  ```python
  norms = np.linalg.norm(X, axis=1, keepdims=True)   # (n, 1)
  X / norms                                          # (n, d) / (n, 1) -> OK
  ```
  - `keepdims=True` garde l'axe réduit avec une taille 1 : le résultat se broadcast directement contre l'entrée.
  - Similarité cosinus de toutes les paires : `Xn @ Xn.T` après normalisation.
