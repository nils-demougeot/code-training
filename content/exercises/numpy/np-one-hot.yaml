id: np-one-hot
title: Encodage one-hot
domain: numpy
difficulty: medium
minutes: 6
interview: true
tags: [fancy indexing, eye, encodage]
cards: [np-fancy-index, np-eye]
statement: |
  Écris `one_hot(labels, num_classes)` : `labels` est un tableau d'entiers de shape `(n,)` entre `0` et `num_classes - 1`. Renvoie une matrice `(n, num_classes)` de `0.` et `1.` (float).

  ```python
  one_hot(np.array([0, 2, 1]), 3)
  # [[1., 0., 0.],
  #  [0., 0., 1.],
  #  [0., 1., 0.]]
  ```

  Puis la réciproque `from_one_hot(Y)` qui renvoie les labels entiers.
starter: |
  import numpy as np


  def one_hot(labels, num_classes):
      pass


  def from_one_hot(Y):
      pass
solution: |
  import numpy as np


  def one_hot(labels, num_classes):
      Y = np.zeros((labels.shape[0], num_classes))
      Y[np.arange(labels.shape[0]), labels] = 1.0
      return Y


  def from_one_hot(Y):
      return Y.argmax(axis=1)
tests:
  - call: one_hot(np.array([0, 2, 1]), 3)
    expected: np.array([[1., 0., 0.], [0., 0., 1.], [0., 1., 0.]])
  - call: from_one_hot(np.array([[0., 1.], [1., 0.]]))
    expected: np.array([1, 0])
  - call: one_hot(np.array([3, 3, 0]), 5)
    hidden: true
  - name: Aller-retour
    check: |
      y = np.random.default_rng(0).integers(0, 7, size=100)
      assert np.array_equal(from_one_hot(one_hot(y, 7)), y)
      assert one_hot(y, 7).dtype.kind == 'f', "la matrice doit être en float"
hints:
  - "Astuce n°1 : `np.eye(num_classes)[labels]` (chaque label sélectionne une ligne de l'identité)."
  - "Astuce n°2 : *fancy indexing* `Y[np.arange(n), labels] = 1` met un 1 aux positions `(i, labels[i])`."
  - "Pour revenir aux labels : l'indice du max de chaque ligne."
explanation: |
  ```python
  np.eye(C)[labels]                     # one-hot en une ligne
  Y[np.arange(n), labels] = 1           # fancy indexing par paires (i, j)
  Y.argmax(axis=1)                      # retour aux labels
  ```
  - Indexer avec **deux tableaux d'entiers** sélectionne des éléments par paires, pas un sous-bloc.
  - Pour un sous-bloc (lignes `r`, colonnes `c`) : `A[np.ix_(r, c)]`.
  - En pratique : `OneHotEncoder` (sklearn), `pd.get_dummies`, `torch.nn.functional.one_hot`.
