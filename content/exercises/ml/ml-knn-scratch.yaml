id: ml-knn-scratch
title: k plus proches voisins from scratch
domain: ml
difficulty: medium
minutes: 10
interview: true
tags: [kNN, argsort, bincount, vectorisation]
cards: [np-bincount, np-argsort-desc]
statement: |
  Implémente `knn_predict(X_train, y_train, X_test, k)` pour la **classification** :

  - distance euclidienne, calculée **sans boucle sur les points** (broadcasting) ;
  - vote majoritaire parmi les `k` voisins ; en cas d'égalité, la **plus petite** classe gagne ;
  - `y_train` contient des entiers `0..C-1` ; renvoie un tableau d'entiers de shape `(n_test,)`.
starter: |
  import numpy as np


  def knn_predict(X_train, y_train, X_test, k):
      pass
solution: |
  import numpy as np


  def knn_predict(X_train, y_train, X_test, k):
      d2 = ((X_test[:, None, :] - X_train[None, :, :]) ** 2).sum(axis=-1)   # (n_test, n_train)
      nearest = np.argsort(d2, axis=1, kind='stable')[:, :k]                # (n_test, k)
      labels = y_train[nearest]                                             # (n_test, k)
      n_classes = y_train.max() + 1
      return np.array([np.bincount(row, minlength=n_classes).argmax() for row in labels])
setup: |
  import numpy as np
  X_train = np.array([[0., 0.], [0., 1.], [1., 0.], [5., 5.], [5., 6.], [6., 5.]])
  y_train = np.array([0, 0, 0, 1, 1, 1])
tests:
  - call: knn_predict(X_train, y_train, np.array([[0.2, 0.2], [5.5, 5.5]]), 3)
    expected: np.array([0, 1])
  - name: k = 1 sur le train = labels du train
    call: knn_predict(X_train, y_train, X_train, 1)
    expected: y_train
  - name: Identique à scikit-learn sur Iris
    check: |
      from sklearn.datasets import load_iris
      from sklearn.neighbors import KNeighborsClassifier
      X, y = load_iris(return_X_y=True)
      idx = np.random.default_rng(0).permutation(len(X))
      tr, te = idx[:100], idx[100:]
      ours = knn_predict(X[tr], y[tr], X[te], 5)
      theirs = KNeighborsClassifier(5).fit(X[tr], y[tr]).predict(X[te])
      agree = (ours == theirs).mean()
      assert agree >= 0.97, f"seulement {agree:.0%} d'accord avec sklearn"
hints:
  - "Matrice des distances au carré `(n_test, n_train)` : `((X_test[:, None, :] - X_train[None, :, :]) ** 2).sum(-1)` (pas besoin de la racine pour trier)."
  - "`np.argsort(d2, axis=1)[:, :k]` donne les indices des k plus proches ; `y_train[ces_indices]` leurs labels."
  - "`np.bincount(labels).argmax()` : la classe la plus fréquente (argmax renvoie le premier max, donc la plus petite classe en cas d'égalité)."
explanation: |
  - **Entraînement** O(1) (on stocke les données), **prédiction** O(n_train · d) par point : kNN est *lazy*.
  - Pas besoin de la racine carrée pour trouver les plus proches : elle est croissante.
  - Hyperparamètre `k` : petit = variance élevée, grand = biais élevé (voir le lab *Comparer les modèles*).
  - **Toujours standardiser** les features avant un kNN.
  - En production : arbres KD / Ball tree, ou index approximatifs (FAISS, HNSW) pour des millions de vecteurs.
