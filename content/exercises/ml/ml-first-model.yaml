id: ml-first-model
title: Premier modèle scikit-learn
domain: ml
difficulty: easy
minutes: 5
tags: [train_test_split, fit, predict, accuracy]
cards: [sk-split-stratify, sk-fit-predict, sk-accuracy]
statement: |
  Le squelette de tout projet scikit-learn. Écris `train_iris()` qui :

  1. charge le dataset Iris (`load_iris(return_X_y=True)`) ;
  2. le découpe en train/test avec **25 % de test**, **stratifié** sur `y`, `random_state=42` ;
  3. entraîne une `LogisticRegression(max_iter=1000)` sur le train ;
  4. renvoie le tuple `(model, accuracy_test)`.
starter: |
