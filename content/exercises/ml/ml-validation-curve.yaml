  - |
    import numpy as np


    def fit_predict(x_train, y_train, x_eval, degree):
        return np.polyval(np.polyfit(x_train, y_train, degree), x_eval)


    def mse(a, b):
        return float(np.mean(np.abs(np.asarray(a) - np.asarray(b))))


    def validation_curve(x_tr, y_tr, x_val, y_val, degrees):
        tr, va = [], []
        for d in degrees:
            tr.append(mse(fit_predict(x_tr, y_tr, x_tr, d), y_tr))
            va.append(mse(fit_predict(x_tr, y_tr, x_val, d), y_val))
        return tr, va


    def best_degree(x_tr, y_tr, x_val, y_val, degrees):
        tr, va = validation_curve(x_tr, y_tr, x_val, y_val, degrees)
        return degrees[int(np.argmin(tr))]
parsons:
  distractors:
    - line: "return degrees[int(np.argmin(train_errors))]"
      replaces: "return degrees[int(np.argmin(val_errors))]"
    - line: "_, val_errors = validation_curve(x_val, y_val, x_tr, y_tr, degrees)"
      replaces: "_, val_errors = validation_curve(x_tr, y_tr, x_val, y_val, degrees)"
hints:
  - "`np.polyfit(x, y, d)` renvoie les coefficients ; `np.polyval(coefs, x)` évalue le polynôme."
  - "Le modèle est **toujours** ajusté sur le train ; on l'évalue sur le train et sur la validation."
  - "Choisir le degré sur l'erreur de train donnerait toujours le degré maximal."
explanation: |
  - **Sous-apprentissage** (degré 0-1) : erreurs de train et de validation élevées → biais.
  - **Sur-apprentissage** (degré 12 avec 20 points) : train presque parfait, validation qui explose → variance.
  - Le bon modèle est au **creux** de la courbe de validation. Les hyperparamètres se choisissent sur la validation, puis on mesure une seule fois sur un jeu de test.
  - Voir le lab « Comparer les modèles » pour le même phénomène en 2D.
