parsons:
  distractors:
    - line: "if best is None or score <= best[2]:"
      replaces: "if best is None or score < best[2]:"
    - line: "return float(np.sum(p ** 2))"
      replaces: "return float(1 - np.sum(p ** 2))"
hints:
  - "`np.unique(y, return_counts=True)` donne les effectifs par classe."
  - "Pondère l'impureté de chaque enfant par sa **taille** relative."
  - "Seuils candidats : `(values[:-1] + values[1:]) / 2` avec `values = np.unique(colonne)`."
  - "`<` strict garde le premier meilleur trouvé, donc la plus petite feature et le plus petit seuil."
explanation: |
  - Un arbre de décision est un algorithme **glouton** : à chaque nœud, il teste toutes les features et tous les seuils, et garde le split qui réduit le plus l'impureté. Puis il recommence dans chaque enfant.
  - Gini (scikit-learn par défaut) et entropie donnent presque toujours les mêmes arbres.
  - Sans pondération par la taille, un split qui isole un seul point pur paraît excellent.
  - C'est aussi la base de la **feature importance** : la somme des réductions d'impureté apportées par chaque feature.
