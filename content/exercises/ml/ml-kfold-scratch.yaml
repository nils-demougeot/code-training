parsons:
  distractors:
    - line: "model.fit(X, y)"
      replaces: "model.fit(X[train], y[train])"
    - line: "start = size"
      replaces: "start += size"
hints:
  - "Tailles des blocs : `n // k`, plus 1 pour les `n % k` premiers."
  - "Validation = `np.arange(start, start + size)` ; train = tout le reste (`np.concatenate` des deux morceaux)."
  - "Entraîner sur `X` entier, validation comprise, donne un score optimiste : c'est une fuite."
explanation: |
  - La validation croisée estime la performance **et sa variabilité** (écart-type des scores entre folds).
  - Chaque fold a son propre modèle : réentraîner le même objet est correct avec scikit-learn (`fit` repart de zéro), mais un nouveau modèle évite tout état partagé.
  - Sans mélange, des données triées (par date, par classe) donnent des folds déséquilibrés : `KFold(shuffle=True, random_state=0)` ou `StratifiedKFold` pour la classification, `TimeSeriesSplit` pour des séries temporelles.
