  - |
    import numpy as np


    def precision_recall_at(y, proba, threshold):
        pred = proba >= threshold
        tp = int((pred & (y == 1)).sum())
        fp = int((pred & (y == 0)).sum())
        fn = int((~pred & (y == 1)).sum())
        return (tp / (tp + fp) if tp + fp else 1.0), (tp / (tp + fn) if tp + fn else 0.0)


    def best_f1_threshold(y, proba):
        thresholds = np.unique(proba)
        acc = [((proba >= t) == y).mean() for t in thresholds]
        return float(thresholds[int(np.argmax(acc))])


    def min_cost_threshold(y, proba, cost_fp, cost_fn):
        thresholds = np.unique(proba)
        costs = []
        for t in thresholds:
            pred = proba >= t
            costs.append(cost_fn * (pred & (y == 0)).sum() + cost_fp * (~pred & (y == 1)).sum())
        return float(thresholds[int(np.argmin(costs))])
parsons:
  distractors:
    - line: "fn = int((pred & (y == 0)).sum())"
      replaces: "fn = int((~pred & (y == 1)).sum())"
    - line: "return float(thresholds[int(np.argmax(costs))])"
      replaces: "return float(thresholds[int(np.argmin(costs))])"
hints:
  - "TP : prédit positif et vraiment positif ; FP : prédit positif mais négatif ; FN : prédit négatif mais positif."
  - "`np.unique` trie les seuils : `argmax` / `argmin` renvoient le premier indice, donc le plus petit seuil en cas d'égalité."
  - "Le coût dépend des erreurs, pas de l'accuracy."
explanation: |
  - Le seuil est un **choix métier** : baisser le seuil augmente le recall (moins de faux négatifs) et baisse la precision.
  - Avec des coûts asymétriques (rater une fraude coûte 20 fois plus qu'une fausse alerte), on choisit le seuil qui minimise le coût attendu, sur un jeu de **validation**.
  - Le seuil se règle sur des probabilités bien **calibrées** (`CalibratedClassifierCV`) ; un modèle mal calibré décale tout.
