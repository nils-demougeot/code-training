        return np.array(fpr), np.array(tpr)


    def auc_trapz(fpr, tpr):
        return float(np.sum(np.diff(fpr) * tpr[1:]))
  - |
    import numpy as np


    def auc_pairs(y, scores):
        return float(((scores > 0.5) == y).mean())


    def roc_points(y, scores):
        thresholds = np.unique(scores)
        tpr = [0.0] + [((scores >= t) & (y == 1)).sum() / (y == 1).sum() for t in thresholds]
        fpr = [0.0] + [((scores >= t) & (y == 0)).sum() / (y == 0).sum() for t in thresholds]
        return np.array(fpr), np.array(tpr)


    def auc_trapz(fpr, tpr):
