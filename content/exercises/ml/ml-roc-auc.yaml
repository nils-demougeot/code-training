parsons:
  distractors:
    - line: "thresholds = np.unique(scores)"
      replaces: "thresholds = np.unique(scores)[::-1]"
    - line: "return float((diff > 0).mean())"
      replaces: "return float(((diff > 0) + 0.5 * (diff == 0)).mean())"
hints:
  - "`pos[:, None] - neg[None, :]` donne la matrice de toutes les différences (positif − négatif)."
  - "Une paire vaut 1 si la différence est > 0, ½ si elle est nulle, 0 sinon. L'AUC est la moyenne."
  - "Pour chaque seuil `t` (du plus grand au plus petit), TPR = vrais positifs / positifs, FPR = faux positifs / négatifs, avec la prédiction `score >= t`."
  - "Trapèzes : $\\sum (x_{i+1} - x_i) \\frac{y_{i+1} + y_i}{2}$."
explanation: |
  - L'AUC mesure la qualité du **classement** (ranking), indépendamment du seuil : 0,5 = hasard, 1 = parfait, < 0,5 = classement inversé.
  - Elle est insensible au déséquilibre des classes pour le classement, mais peut être trompeuse quand seuls les tout premiers rangs comptent (fraude, recherche) : regarder alors la courbe precision-recall.
  - L'interprétation par paires est la statistique U de **Mann-Whitney** normalisée.
  - Les égalités de score comptent pour ½ : les ignorer sous-estime l'AUC.
