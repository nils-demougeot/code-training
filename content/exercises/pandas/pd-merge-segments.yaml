id: pd-merge-segments
title: Jointure et agrégat par segment
domain: pandas
difficulty: medium
minutes: 7
shared: shop_df
interview: true
tags: [merge, how=left, jointure, fillna]
cards: [pd-merge-left, pd-merge-indicator]
setup: |
  import pandas as pd
  SEGMENTS = pd.DataFrame({
      'customer': ['Alice', 'Bruno', 'Chloé', 'David', 'Emma', 'Zoé'],
      'segment': ['premium', 'standard', 'premium', 'standard', 'nouveau', 'premium'],
  })
statement: |
  La table `SEGMENTS` associe certains clients à un segment marketing. Certains clients de `orders` n'y sont **pas**, et `Zoé` n'a **jamais commandé**.

  1. `with_segment(orders, segments)` : `orders` enrichi d'une colonne `segment` ; les clients absents de `segments` ont le segment `'inconnu'`. Le nombre de lignes de `orders` ne doit pas changer.
  2. `revenue_by_segment(orders, segments)` : DataFrame à plat `segment, revenue` (somme de `qty * price`), trié par `revenue` décroissant, index `0..n-1`.
  3. `customers_without_orders(orders, segments)` : liste triée des clients de `segments` sans aucune commande.
starter: |
  import pandas as pd


  def with_segment(orders, segments):
      pass


  def revenue_by_segment(orders, segments):
      pass


  def customers_without_orders(orders, segments):
      pass
solution: |
  import pandas as pd


  def with_segment(orders, segments):
      out = orders.merge(segments, on='customer', how='left')
      out['segment'] = out['segment'].fillna('inconnu')
      return out


  def revenue_by_segment(orders, segments):
      df = with_segment(orders, segments)
      df['revenue'] = df['qty'] * df['price']
      out = df.groupby('segment', as_index=False)['revenue'].sum()
      return out.sort_values('revenue', ascending=False).reset_index(drop=True)


  def customers_without_orders(orders, segments):
      merged = segments.merge(orders[['customer']].drop_duplicates(), on='customer', how='left', indicator=True)
      return sorted(merged.loc[merged['_merge'] == 'left_only', 'customer'])
tests:
  - call: with_segment(orders, SEGMENTS)
  - call: revenue_by_segment(orders, SEGMENTS)
  - call: customers_without_orders(orders, SEGMENTS)
    expected: "['Zoé']"
  - name: Pas de lignes ajoutées ou perdues
    check: |
      assert len(with_segment(orders, SEGMENTS)) == len(orders), "la jointure a changé le nombre de commandes"
hints:
  - "`orders.merge(segments, on='customer', how='left')` garde toutes les commandes."
  - "Les clients sans segment ont `NaN` : `fillna('inconnu')`."
  - "Pour trouver les clients sans commande : `merge(..., how='left', indicator=True)` puis filtrer `_merge == 'left_only'`. Ou plus simple : `~segments.customer.isin(orders.customer)`."
explanation: |
  ```python
  a.merge(b, on='key', how='left')     # inner (défaut) | left | right | outer
  a.merge(b, left_on='id', right_on='customer_id')
  a.merge(b, on='key', how='left', indicator=True)   # colonne _merge : both / left_only / right_only
  a[~a['key'].isin(b['key'])]          # anti-jointure
  ```
  - Piège : si la clé est **dupliquée** dans `b`, un merge **multiplie** les lignes. Vérifie avec `validate='many_to_one'`.
  - `how='inner'` (le défaut !) supprime silencieusement les lignes sans correspondance.
