parsons:
  distractors:
    - line: "return revenue.nlargest(n, 'revenue').reset_index(drop=True)"
      replaces: "return ("
hints:
  - "D'abord agréger le CA par `(category, product)`."
  - "Trie **tout** le tableau dans l'ordre voulu, puis `groupby('category').head(n)` garde les n premières lignes de chaque groupe."
  - "`ascending` accepte une liste : `[True, False, True]`."
explanation: |
  ```python
  (rev.sort_values(['category', 'revenue'], ascending=[True, False])
      .groupby('category').head(n))
  ```
  - Le pattern **trier puis `groupby().head(n)`** est la façon la plus simple de faire un « top N par groupe ».
  - Équivalent SQL : `ROW_NUMBER() OVER (PARTITION BY category ORDER BY revenue DESC) <= n`.
  - Alternative : `groupby('category', group_keys=False).apply(lambda g: g.nlargest(n, 'revenue'))`, plus lente.
