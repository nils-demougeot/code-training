    def last_order_per_customer(df):
        return df.drop_duplicates('customer', keep='last').sort_values('customer').reset_index(drop=True)


    def dedupe_exact(df, cols):
        return df.drop_duplicates(subset=cols, keep='first')
  - |
    import pandas as pd


    def last_order_per_customer(df):
        return (
            df.sort_values(['customer', 'date', 'order_id'])
            .drop_duplicates('customer', keep='last')
            .reset_index(drop=True)
        )


    def dedupe_exact(df, cols):
        return df.drop_duplicates(subset=cols).reset_index(drop=True)
parsons:
  distractors:
    - line: "return df.sort_values(['customer', 'date', 'order_id']).drop_duplicates('customer', keep='first').reset_index(drop=True)"
      replaces: "return ("
hints:
  - "Trie d'abord pour que la ligne voulue soit la **dernière** de chaque client, puis `drop_duplicates('customer', keep='last')`."
  - "`drop_duplicates(subset=cols)` garde la première occurrence par défaut et conserve l'index d'origine."
explanation: |
  - **Trier puis `drop_duplicates(keep='last')`** : l'idiome pour « la dernière version de chaque clé » (dernier statut d'une commande, dernière adresse d'un client…).
  - Sans tri, « dernière » veut dire « dernière dans l'ordre actuel du DataFrame », pas « la plus récente ».
  - Équivalent SQL : `ROW_NUMBER() OVER (PARTITION BY customer ORDER BY date DESC, order_id DESC) = 1`.
