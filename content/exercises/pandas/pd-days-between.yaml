  - |
    import pandas as pd


    def add_gap(df):
        out = df.sort_values(['customer', 'date', 'order_id']).reset_index(drop=True)
        out['days_since_prev'] = out.groupby('customer')['date'].diff(-1).dt.days.abs()
        return out


    def median_gap(df):
        return add_gap(df).groupby('customer')['days_since_prev'].mean().dropna().sort_index()
parsons:
  distractors:
    - line: "out['days_since_prev'] = out['date'].diff().dt.days"
      replaces: "out['days_since_prev'] = out.groupby('customer')['date'].diff().dt.days"
hints:
  - "Trie d'abord : `diff` compare chaque ligne à la **précédente dans l'ordre actuel**."
  - "`groupby('customer')['date'].diff()` repart de zéro pour chaque client (NaN sur sa première ligne)."
  - "Une différence de dates est un `Timedelta` : `.dt.days` donne le nombre de jours."
explanation: |
  - `groupby().diff()` / `groupby().shift()` : l'équivalent pandas de `LAG()` en SQL.
  - Sans le `groupby`, la première commande d'un client serait comparée à la dernière du client précédent : un bug silencieux classique.
  - Feature très utile en churn : un client dont l'écart actuel dépasse largement son écart médian est à risque.
