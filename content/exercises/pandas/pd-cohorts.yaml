        return d.pivot_table(index='cohort', columns='months_since', values='customer', aggfunc='nunique', fill_value=0)
  - |
    import pandas as pd


    def add_cohort(df):
        out = df.copy()
        month = out['date'].dt.to_period('M')
        out['cohort'] = month.groupby(out['customer']).transform('min')
        out['months_since'] = (month - out['cohort']).apply(lambda offset: offset.n)
        return out


    def retention(df):
        d = add_cohort(df)
        return d.pivot_table(index='cohort', columns='months_since', values='customer', aggfunc='count', fill_value=0)
parsons:
  distractors:
    - line: "out['cohort'] = month.groupby(out['customer']).min()"
      replaces: "out['cohort'] = month.groupby(out['customer']).transform('min')"
    - line: "return d.pivot_table(index='cohort', columns='months_since', values='customer', aggfunc='count', fill_value=0)"
      replaces: "return d.pivot_table(index='cohort', columns='months_since', values='customer', aggfunc='nunique', fill_value=0)"
hints:
  - "`df['date'].dt.to_period('M')` donne le mois de chaque commande."
  - "`groupby(...).transform('min')` renvoie, **pour chaque ligne**, le minimum de son groupe (même longueur que `df`), contrairement à `.min()` qui renvoie une ligne par groupe."
  - "La différence de deux `Period` est un décalage ; son attribut `.n` est le nombre de mois."
  - "`pivot_table(..., aggfunc='nunique', fill_value=0)` compte les clients distincts."
explanation: |
  - `transform` est la clé : elle « rediffuse » une statistique de groupe sur chaque ligne, sans jointure.
  - Une table de rétention se lit en diagonale : la colonne 0 est la taille de la cohorte, les colonnes suivantes la part qui revient.
  - `nunique` et pas `count` : un client qui commande deux fois le même mois ne compte qu'une fois.
