    import numpy as np
    import pandas as pd


    def basket_segment(df):
        amount = df['qty'] * df['price']
        return pd.cut(amount, bins=[-np.inf, 50, 200, np.inf], labels=['petit', 'moyen', 'gros'], right=False)


    def segment_share(df):
        return basket_segment(df).value_counts(normalize=True)


