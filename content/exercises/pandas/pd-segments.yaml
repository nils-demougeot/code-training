parsons:
  distractors:
    - line: "return pd.cut(df['qty'] * df['price'], bins=4, labels=['Q1', 'Q2', 'Q3', 'Q4'])"
      replaces: "return pd.qcut(df['qty'] * df['price'], q=4, labels=['Q1', 'Q2', 'Q3', 'Q4'])"
hints:
  - "`pd.cut(x, bins=[...], labels=[...])` : par défaut les intervalles sont fermés **à droite** `(a, b]`. Ici il faut `[a, b)` → `right=False`."
  - "`np.inf` comme bornes extrêmes pour ne rien laisser dehors."
  - "`value_counts(normalize=True, sort=False)` garde l'ordre des catégories au lieu de trier par fréquence."
  - "`pd.qcut(x, q=4)` découpe en groupes de même effectif."
explanation: |
  - `pd.cut` : bornes **fixées** par toi ; `pd.qcut` : bornes calculées pour des groupes **de même taille**.
  - Le piège des bornes : `(50, 200]` contre `[50, 200)` change le segment d'une commande de 50 € pile. Toujours vérifier les cas limites.
  - Le résultat est de type `category`, ordonné : `value_counts(sort=False)` respecte cet ordre.
