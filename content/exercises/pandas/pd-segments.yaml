id: pd-segments
title: Segmenter avec pd.cut et pd.qcut
domain: pandas
difficulty: easy
minutes: 6
shared: shop_df
tags: [cut, qcut, value_counts, catégories]
statement: |
  1. `basket_segment(df)` : renvoie une Series (même index que `df`) qui classe chaque commande selon son montant `qty * price` :
     - `'petit'` si montant < 50 ;
     - `'moyen'` si 50 ≤ montant < 200 ;
     - `'gros'` si montant ≥ 200.
  2. `segment_share(df)` : la proportion de commandes dans chaque segment, une Series indexée par `['petit', 'moyen', 'gros']` dans **cet ordre**.
  3. `quartile_labels(df)` : le quartile du montant de chaque commande, étiqueté `'Q1'` à `'Q4'` (`pd.qcut`).
starter: |
  import numpy as np
  import pandas as pd


  def basket_segment(df):
      pass


  def segment_share(df):
      pass


  def quartile_labels(df):
      pass
solution: |
  import numpy as np
  import pandas as pd


  def basket_segment(df):
      amount = df['qty'] * df['price']
      return pd.cut(amount, bins=[-np.inf, 50, 200, np.inf], labels=['petit', 'moyen', 'gros'], right=False)


  def segment_share(df):
      return basket_segment(df).value_counts(normalize=True, sort=False)


  def quartile_labels(df):
      return pd.qcut(df['qty'] * df['price'], q=4, labels=['Q1', 'Q2', 'Q3', 'Q4'])
