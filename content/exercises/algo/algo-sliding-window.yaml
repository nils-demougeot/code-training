        best = window
        for i in range(k, len(nums)):
            window += nums[i] - nums[i - k + 1]
            best = max(best, window)
        return best


    def shortest_subarray_at_least(nums, target):
        best = float('inf')
        total = left = 0
        for right, x in enumerate(nums):
            total += x
            if total >= target:
                best = min(best, right - left + 1)
                total -= nums[left]
                left += 1
        return 0 if best == float('inf') else best
parsons:
  distractors:
    - line: "if total >= target:"
      replaces: "while total >= target:"
    - line: "window += nums[i] - nums[i - k + 1]"
      replaces: "window += nums[i] - nums[i - k]"
hints:
  - "Fenêtre de taille fixe : quand l'indice `i` entre, l'indice `i - k` sort."
  - "Fenêtre de taille variable : avance `right` ; **tant que** la somme suffit, enregistre la longueur puis avance `left`."
explanation: |
  - **Taille fixe** : maintenir la somme courante, `window += entrant - sortant`.
  - **Taille variable** (deux pointeurs) : `right` agrandit, `left` réduit ; chaque indice entre et sort au plus une fois → O(n).
  - La version variable suppose des nombres **positifs** (la somme croît avec la fenêtre). Avec des négatifs, il faut des sommes préfixes et une deque.
