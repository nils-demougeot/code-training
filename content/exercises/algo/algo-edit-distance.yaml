parsons:
  distractors:
    - line: "cur = [0] * (len(b) + 1)"
      replaces: "cur = [i] + [0] * len(b)"
    - line: "cost = 1 if a[i - 1] == b[j - 1] else 0"
      replaces: "cost = 0 if a[i - 1] == b[j - 1] else 1"
hints:
  - "`D[i][j]` = distance entre les `i` premiers caractères de `a` et les `j` premiers de `b`."
  - "`D[i][0] = i` et `D[0][j] = j` (que des suppressions ou des insertions)."
  - "`D[i][j] = min(D[i-1][j] + 1, D[i][j-1] + 1, D[i-1][j-1] + (a[i-1] != b[j-1]))`."
  - "On n'a besoin que de la ligne précédente : deux listes suffisent."
explanation: |
  - Programmation dynamique classique sur deux chaînes : O(len(a) × len(b)) en temps, O(len(b)) en mémoire avec deux lignes.
  - Les trois transitions : suppression (`D[i-1][j] + 1`), insertion (`D[i][j-1] + 1`), remplacement ou rien (`D[i-1][j-1] + coût`).
  - Comparer caractère à caractère (`zip`) ne gère pas les décalages : « chat » / « hcat » n'est pas un décalage, mais « chat » / « chats » oui.
  - Cousins : plus longue sous-séquence commune (diff), alignement de séquences ADN, WER en reconnaissance vocale.
