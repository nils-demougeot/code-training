id: algo-edit-distance
title: Distance d'édition (Levenshtein)
domain: algo
difficulty: hard
minutes: 15
interview: true
tags: [programmation dynamique, chaînes, tableau 2D]
statement: |
  La **distance d'édition** entre deux chaînes est le nombre minimal d'opérations pour passer de l'une à l'autre, chaque opération étant l'**insertion**, la **suppression** ou le **remplacement** d'un caractère.

  ```python
  edit_distance("chat", "chats")      # 1 (insertion)
  edit_distance("kitten", "sitting")  # 3
  ```

  Écris `edit_distance(a, b)` en programmation dynamique, puis `closest(word, vocabulary)` : le mot du vocabulaire le plus proche (le premier dans l'ordre de la liste en cas d'égalité), comme un correcteur orthographique.
starter: |
  def edit_distance(a, b):
      pass


  def closest(word, vocabulary):
      pass
solution: |
  def edit_distance(a, b):
      prev = list(range(len(b) + 1))
      for i in range(1, len(a) + 1):
          cur = [i] + [0] * len(b)
          for j in range(1, len(b) + 1):
              cost = 0 if a[i - 1] == b[j - 1] else 1
              cur[j] = min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost)
          prev = cur
      return prev[-1]


  def closest(word, vocabulary):
      return min(vocabulary, key=lambda w: edit_distance(word, w))
tests:
  - call: edit_distance("chat", "chats")
    expected: "1"
  - call: edit_distance("kitten", "sitting")
    expected: "3"
  - call: edit_distance("", "abc")
    expected: "3"
  - call: edit_distance("intention", "execution")
    expected: "5"
  - call: edit_distance("same", "same")
    expected: "0"
  - call: "closest('pyhton', ['java', 'python', 'pytorch', 'photon'])"
    expected: "'python'"
  - name: Comparé à une version récursive mémoïsée
    check: |
      import random
      from functools import lru_cache
      def ref(a, b):
          @lru_cache(None)
          def d(i, j):
              if i == 0 or j == 0:
                  return i + j
              return min(d(i - 1, j) + 1, d(i, j - 1) + 1, d(i - 1, j - 1) + (a[i - 1] != b[j - 1]))
          return d(len(a), len(b))
      rnd = random.Random(5)
      for _ in range(300):
          a = ''.join(rnd.choice('abc') for _ in range(rnd.randint(0, 7)))
          b = ''.join(rnd.choice('abc') for _ in range(rnd.randint(0, 7)))
          assert edit_distance(a, b) == ref(a, b), (a, b)
