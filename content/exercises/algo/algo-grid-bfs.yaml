id: algo-grid-bfs
title: Plus court chemin dans une grille (BFS)
domain: algo
difficulty: medium
minutes: 12
interview: true
tags: [BFS, graphe, deque, grille]
cards: [cx-deque]
statement: |
  Une grille est une liste de chaînes : `'.'` = case libre, `'#'` = mur. On se déplace en haut/bas/gauche/droite.

  Écris `shortest_path(grid, start, end)` qui renvoie le **nombre minimal de déplacements** de `start` à `end` (tuples `(ligne, colonne)`), ou `-1` si c'est impossible.

  ```python
  grid = ["..#",
          "..#",
          "..."]
  shortest_path(grid, (0, 0), (0, 1))  # 1
  ```
starter: |
  from collections import deque


  def shortest_path(grid, start, end):
      pass
solution: |
  from collections import deque


  def shortest_path(grid, start, end):
      rows, cols = len(grid), len(grid[0])
      queue = deque([(start, 0)])
      seen = {start}
      while queue:
          (r, c), dist = queue.popleft()
          if (r, c) == end:
              return dist
          for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
              nr, nc = r + dr, c + dc
              if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] == '.' and (nr, nc) not in seen:
                  seen.add((nr, nc))
                  queue.append(((nr, nc), dist + 1))
      return -1
setup: |
  MAZE = [
      "....#....",
      ".##.#.##.",
      ".#..#..#.",
      ".#.###.#.",
      ".#.....#.",
      ".#######.",
      ".........",
  ]
tests:
  - call: "shortest_path(['..#', '..#', '...'], (0, 0), (2, 2))"
    expected: "4"
  - call: shortest_path(MAZE, (0, 0), (0, 8))
    expected: "20"
  - name: Inaccessible
    call: "shortest_path(['.#.', '###', '...'], (0, 0), (0, 2))"
    expected: "-1"
  - call: "shortest_path(['.'], (0, 0), (0, 0))"
    expected: "0"
  - name: Grande grille ouverte
    call: shortest_path(['.' * 300] * 300, (0, 0), (299, 299))
    expected: "598"
  - name: Comparé à une référence sur des labyrinthes aléatoires
    check: |
      import random
      def reference(grid, start, end):
          rows, cols = len(grid), len(grid[0])
          frontier, seen, dist = {start}, {start}, 0
          while frontier:
              if end in frontier:
                  return dist
              nxt = set()
              for r, c in frontier:
                  for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
                      if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] == '.' and (nr, nc) not in seen:
                          seen.add((nr, nc)); nxt.add((nr, nc))
              frontier, dist = nxt, dist + 1
          return -1
      rnd = random.Random(1)
      for _ in range(300):
          rows, cols = rnd.randint(1, 7), rnd.randint(1, 7)
          grid = [''.join('#' if rnd.random() < 0.3 else '.' for _ in range(cols)) for _ in range(rows)]
          free = [(r, c) for r in range(rows) for c in range(cols) if grid[r][c] == '.']
          if len(free) < 2:
              continue
          s, e = rnd.sample(free, 2)
          assert shortest_path(grid, s, e) == reference(grid, s, e), (grid, s, e)
hints:
  - "Dans un graphe **non pondéré**, le BFS (parcours en largeur) trouve le plus court chemin : il explore par distances croissantes."
  - "File FIFO : `collections.deque` avec `append` et `popleft`."
  - "Marque une case comme vue **au moment où tu l'ajoutes** à la file, pas quand tu la retires (sinon elle est ajoutée plusieurs fois)."
explanation: |
  ```python
  queue, seen = deque([(start, 0)]), {start}
  while queue:
      node, d = queue.popleft()
      if node == end: return d
      for nxt in neighbors(node):
          if nxt not in seen:
              seen.add(nxt); queue.append((nxt, d + 1))
  ```
  - **BFS** → plus court chemin non pondéré. **DFS** → existence d'un chemin, composantes connexes, cycles. **Dijkstra** (heap) → poids positifs.
  - Complexité O(V + E) : ici O(lignes × colonnes).
  - `list.pop(0)` est O(n) : utilise `deque.popleft()`, qui est O(1).
