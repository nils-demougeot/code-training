id: algo-islands
title: Compter les îles
domain: algo
difficulty: medium
minutes: 10
interview: true
tags: [grille, DFS, BFS, composantes connexes]
statement: |
  `grid` est une liste de chaînes de `'1'` (terre) et `'0'` (eau). Une **île** est un groupe de cases de terre reliées **horizontalement ou verticalement** (pas en diagonale).

  1. `count_islands(grid)` : le nombre d'îles.
  2. `island_sizes(grid)` : la liste des tailles des îles (nombre de cases), triée par ordre **décroissant**.

  Ne modifie pas `grid`.
setup: |
  MAP = [
      "11000",
      "11010",
      "00100",
      "00011",
      "10001",
  ]
starter: |
  def count_islands(grid):
      pass


  def island_sizes(grid):
      pass
solution: |
  def island_sizes(grid):
      rows, cols = len(grid), len(grid[0]) if grid else 0
      seen = set()
      sizes = []
      for r in range(rows):
          for c in range(cols):
              if grid[r][c] != '1' or (r, c) in seen:
                  continue
              seen.add((r, c))
              stack, size = [(r, c)], 0
              while stack:
                  y, x = stack.pop()
                  size += 1
                  for ny, nx in ((y + 1, x), (y - 1, x), (y, x + 1), (y, x - 1)):
                      if 0 <= ny < rows and 0 <= nx < cols and grid[ny][nx] == '1' and (ny, nx) not in seen:
                          seen.add((ny, nx))
                          stack.append((ny, nx))
              sizes.append(size)
      return sorted(sizes, reverse=True)


  def count_islands(grid):
      return len(island_sizes(grid))
tests:
  - call: count_islands(MAP)
    expected: "5"
  - call: island_sizes(MAP)
    expected: "[4, 3, 1, 1, 1]"
  - call: count_islands([])
    expected: "0"
  - call: count_islands(["000", "000"])
    expected: "0"
  - name: Pas de connexion en diagonale
    call: count_islands(["101", "010", "101"])
    expected: "5"
  - name: Grande île en serpentin (pas de récursion trop profonde)
    check: |
      n = 120
      g = ["1" * n if i % 2 == 0 else ("0" * (n - 1) + "1" if i % 4 == 1 else "1" + "0" * (n - 1)) for i in range(n)]
      assert count_islands(g) == 1 and island_sizes(g) == [sum(row.count("1") for row in g)]
