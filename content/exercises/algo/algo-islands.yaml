parsons:
  distractors:
    - line: "if 0 < ny < rows and 0 < nx < cols and grid[ny][nx] == '1' and (ny, nx) not in seen:"
      replaces: "if 0 <= ny < rows and 0 <= nx < cols and grid[ny][nx] == '1' and (ny, nx) not in seen:"
hints:
  - "Parcours la grille ; à chaque case de terre **pas encore visitée**, lance un parcours (DFS ou BFS) qui marque toute l'île."
  - "Le nombre de parcours lancés = le nombre d'îles."
  - "Une pile explicite évite la limite de récursion de Python sur les grandes îles."
explanation: |
  - Compter les **composantes connexes** d'un graphe implicite (la grille). O(lignes × colonnes).
  - Marque une case comme vue **quand tu l'empiles**, pas quand tu la dépiles, sinon elle peut être empilée plusieurs fois.
  - En Python, un DFS récursif dépasse vite la limite de 1000 appels : préfère une pile ou une `deque`.
  - Variantes : plus grande île, île la plus proche (BFS multi-source), régions entourées.
