      def __init__(self, nums):
          self.nums = list(nums)

      def query(self, i, j):
          return sum(self.nums[i:j + 1])


  def count_subarrays_with_sum(nums, k):
      seen = Counter({0: 1})
      total = count = 0
      for x in nums:
          total += x
          count += seen[total - k]
          seen[total] += 1
      return count
