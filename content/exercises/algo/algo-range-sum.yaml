parsons:
  distractors:
    - line: "seen = Counter()"
      replaces: "seen = Counter({0: 1})"
    - line: "return self.prefix[j] - self.prefix[i]"
      replaces: "return self.prefix[j + 1] - self.prefix[i]"
hints:
  - "`prefix = [0, *accumulate(nums)]` : `prefix[t]` = somme des `t` premiers éléments."
  - "`query(i, j) = prefix[j + 1] - prefix[i]`."
  - "Pour compter : un sous-tableau `(i, j]` a une somme `k` si `prefix[j] - prefix[i] == k`. Compte au fur et à mesure combien de préfixes valent `total - k` (dans un `Counter` qui commence à `{0: 1}`)."
explanation: |
  - Les **sommes préfixes** transforment toute somme de plage en une soustraction. Version 2D pour les images (*integral image*).
  - Le préfixe initial `0` évite les cas particuliers quand la plage commence à l'indice 0.
  - `count_subarrays_with_sum` : sommes préfixes + table de hachage, O(n). La fenêtre glissante ne marche pas avec des négatifs.
