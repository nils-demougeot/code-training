id: algo-range-sum
title: Sommes de plages (préfixes)
domain: algo
difficulty: easy
minutes: 8
tags: [sommes préfixes, classe, itertools.accumulate]
statement: |
  Écris une classe `RangeSum` :

  - `RangeSum(nums)` prépare la structure ;
  - `.query(i, j)` renvoie `nums[i] + ... + nums[j]` (**bornes incluses**, `0 <= i <= j < len(nums)`).

  Il y aura **beaucoup** de requêtes : chacune doit être en O(1).

  Puis `count_subarrays_with_sum(nums, k)` : le nombre de sous-tableaux contigus de somme exactement `k` (les nombres peuvent être négatifs).
starter: |
  class RangeSum:
      def __init__(self, nums):
          pass

      def query(self, i, j):
          pass


  def count_subarrays_with_sum(nums, k):
      pass
solution: |
  from collections import Counter
  from itertools import accumulate


  class RangeSum:
      def __init__(self, nums):
          self.prefix = [0, *accumulate(nums)]

      def query(self, i, j):
          return self.prefix[j + 1] - self.prefix[i]


  def count_subarrays_with_sum(nums, k):
      seen = Counter({0: 1})
      total = count = 0
      for x in nums:
          total += x
          count += seen[total - k]
          seen[total] += 1
      return count
tests:
  - call: RangeSum([3, -1, 4, 1, 5]).query(1, 3)
    expected: "4"
  - call: RangeSum([3, -1, 4, 1, 5]).query(0, 4)
    expected: "12"
  - call: RangeSum([7]).query(0, 0)
    expected: "7"
  - call: count_subarrays_with_sum([1, 1, 1], 2)
    expected: "2"
  - call: count_subarrays_with_sum([1, -1, 0], 0)
    expected: "3"
  - name: Comparé à une recherche exhaustive
    check: |
      import random
      rnd = random.Random(7)
      for _ in range(200):
          nums = [rnd.randint(-4, 4) for _ in range(rnd.randint(1, 12))]
          rs = RangeSum(nums)
          for _ in range(10):
              i = rnd.randrange(len(nums)); j = rnd.randrange(i, len(nums))
              assert rs.query(i, j) == sum(nums[i:j + 1])
          k = rnd.randint(-5, 5)
          brute = sum(sum(nums[i:j + 1]) == k for i in range(len(nums)) for j in range(i, len(nums)))
          assert count_subarrays_with_sum(nums, k) == brute, (nums, k)
  - name: "Bonus : requêtes en O(1)"
    bonus: true
    check: |
      def many(nums, queries):
          rs = RangeSum(nums)
          for i, j in queries:
              rs.query(i, j)
      k = growth_exponent(many, lambda n: (list(range(n)), [(0, n - 1)] * n))
      assert k < 1.5, f"n requêtes semblent coûter O(n^{k:.1f}) : précalcule les sommes préfixes une fois, puis query = une soustraction."
complexity:
  target: O(1) par requête
  note: |
    Avec `prefix[i]` = somme des `i` premiers éléments, la somme de `i` à `j` vaut `prefix[j + 1] - prefix[i]`. Le précalcul coûte O(n) une seule fois, puis chaque requête est une soustraction.
naive: |
