    from collections import Counter
    from itertools import accumulate


    class RangeSum:
        def __init__(self, nums):
            self.prefix = [0, *accumulate(nums)]

        def query(self, i, j):
            return self.prefix[j + 1] - self.prefix[i]


    def count_subarrays_with_sum(nums, k):
