parsons:
  distractors:
    - line: "t += rng.exponential(lam)"
      replaces: "t += rng.exponential(1 / lam)"
    - line: "return 1 - sum(poisson_pmf(i, lam) for i in range(k))"
      replaces: "return 1 - sum(poisson_pmf(i, lam) for i in range(k + 1))"
hints:
  - "$P(X > k) = 1 - \\sum_{i=0}^{k} P(X = i)$ : attention à inclure `k`."
  - "Dimensionnement : augmente le nombre d'agents tant que le risque de débordement dépasse le seuil."
  - "Processus de Poisson : les temps entre événements sont exponentiels de moyenne `1 / λ` ; `rng.exponential(scale)` prend la **moyenne** en paramètre."
explanation: |
  - La loi de Poisson modélise un **nombre d'événements** sur une durée (tickets, clics, pannes) quand ils arrivent indépendamment à un rythme constant. Espérance = variance = λ.
  - Les temps entre événements suivent une loi **exponentielle** : les deux vues décrivent le même processus.
  - Dimensionner à la moyenne (`λ / capacité`) sous-estime les besoins : il faut absorber les pics. C'est le principe du dimensionnement de serveurs et de centres d'appels.
  - ⚠️ `numpy.random.exponential(scale)` prend la moyenne $1/\lambda$, pas le taux $\lambda$.
