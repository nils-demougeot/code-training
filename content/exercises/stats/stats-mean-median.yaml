id: stats-mean-median
title: Le salaire moyen du PDG
domain: stats
difficulty: easy
minutes: 6
tags: [moyenne, médiane, variance, robustesse]
cards: [st-median-robust, st-variance-ddof]
statement: |
  Une start-up de 9 personnes : 8 salariés autour de 3 000 € et un PDG à 40 000 €. La « moyenne des salaires » donnée dans l'offre d'emploi est très flatteuse…

  Sans `numpy` ni `statistics`, écris :

  1. `mean(values)` : la moyenne ;
  2. `median(values)` : la médiane (moyenne des deux valeurs centrales si le nombre est pair) ;
  3. `variance(values, ddof=1)` : la variance, avec `ddof=1` pour la variance **d'échantillon** (division par n − 1) et `ddof=0` pour celle de la population.

  Lance **Exécuter** pour comparer moyenne et médiane sur `SALAIRES`.
setup: |
  SALAIRES = [2800, 2900, 3000, 3000, 3100, 3200, 3300, 3400, 40000]
starter: |
  def mean(values):
      pass


  def median(values):
      pass


  def variance(values, ddof=1):
      pass


  mean(SALAIRES), median(SALAIRES)
solution: |
  def mean(values):
      return sum(values) / len(values)


  def median(values):
      s = sorted(values)
      n = len(s)
      mid = n // 2
      return s[mid] if n % 2 else (s[mid - 1] + s[mid]) / 2


  def variance(values, ddof=1):
      m = mean(values)
      return sum((v - m) ** 2 for v in values) / (len(values) - ddof)


  mean(SALAIRES), median(SALAIRES)
tests:
  - call: mean(SALAIRES)
    expected: "7188.888888888889"
  - call: median(SALAIRES)
    expected: "3100"
  - call: median([4, 1, 3, 2])
    expected: "2.5"
  - call: variance([2, 4, 4, 4, 5, 5, 7, 9], ddof=0)
    expected: "4.0"
  - name: Identique au module statistics
    check: |
      import statistics, random
      rnd = random.Random(1)
      for _ in range(50):
          xs = [rnd.uniform(-10, 10) for _ in range(rnd.randint(2, 20))]
          assert abs(median(xs) - statistics.median(xs)) < 1e-9, "median incorrecte"
          assert abs(variance(xs) - statistics.variance(xs)) < 1e-9, "variance (ddof=1) incorrecte"
          assert abs(variance(xs, ddof=0) - statistics.pvariance(xs)) < 1e-9, "variance (ddof=0) incorrecte"
hints:
  - "Médiane : trie, puis prends l'élément du milieu `s[n // 2]` si n est impair."
  - "Variance : moyenne des carrés des écarts à la moyenne, mais on divise par `n - ddof`."
explanation: |
  - La **moyenne** (7 189 €) est tirée par une seule valeur extrême ; la **médiane** (3 100 €) décrit le salarié typique. Sur des données **asymétriques** (salaires, prix, durées), préfère la médiane ou les quantiles.
  - `ddof=1` (diviser par n − 1, correction de Bessel) donne un estimateur **non biaisé** de la variance à partir d'un échantillon.
  - ⚠️ `np.std` utilise `ddof=0` par défaut, `pd.Series.std` utilise `ddof=1`. Deux librairies, deux résultats.
