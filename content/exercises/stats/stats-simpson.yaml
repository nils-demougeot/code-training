parsons:
  skip: true
hints:
  - "Taux global : somme des succès / somme des totaux, **pas** la moyenne des taux des groupes."
  - "Le traitement A est meilleur sur les petits **et** sur les gros calculs… mais il a surtout traité des gros calculs, plus difficiles."
explanation: |
  - A gagne dans chaque groupe (93 % contre 87 %, 73 % contre 69 %) mais perd globalement (78 % contre 83 %) : les médecins réservaient A aux cas **difficiles** (gros calculs). La taille du calcul est une **variable confondante**.
  - Moralité : un taux agrégé mélange des populations différentes. Avant de conclure, segmente par les variables qui influencent à la fois le traitement et le résultat.
  - En A/B test, la **randomisation** répartit les confondants équitablement : c'est pour cela qu'elle permet de conclure à une causalité.
