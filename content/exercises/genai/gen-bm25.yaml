hints:
  - "Precompute once: the average length, the document frequency `n(t)` (count each term once per document: `set(d)`), and a `Counter` per document."
  - "Then loop over documents and query tokens and add up `idf * f * (k1 + 1) / (f + k1 * (1 - b + b * len(d) / avgdl))`."
explanation: |
  - **idf** gives more weight to rare terms ("E4012") than to common ones ("the").
  - **k1** makes term frequency saturate: the 3rd occurrence of "refund" adds less than the 1st.
  - **b** normalises by length: a match in a short document counts more than in a long one.
  - BM25 is fast, transparent and great on exact words and codes; embeddings handle synonyms. **Hybrid search** combines both and is a strong default for RAG.
