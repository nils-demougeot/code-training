hints:
  - "There are `len(words) - n + 1` n-grams in a text of `len(words)` words."
  - "Compare every pair once with two loops `for i ... for j in range(i + 1, ...)`."
explanation: |
  - Shingles + Jaccard detect texts that share most of their word sequences, even with small edits. Note how the comma in document 1 changes a few shingles: normalising punctuation would make the detection stronger.
  - Comparing all pairs is O(n²): for millions of documents, **MinHash + locality-sensitive hashing** estimates Jaccard similarities without comparing every pair.
  - Deduplicating before indexing improves RAG answers (more diverse top-k) and reduces cost.
