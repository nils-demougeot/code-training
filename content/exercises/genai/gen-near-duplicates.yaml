    def near_duplicates(docs, threshold=0.8, n=3):
        sets = [shingles(d, n) for d in docs]
        return [(i, j) for i in range(len(docs)) for j in range(i + 1, len(docs)) if jaccard(sets[i], sets[j]) >= threshold]
