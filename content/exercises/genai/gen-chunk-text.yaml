id: gen-chunk-text
title: Split a document into overlapping chunks
domain: genai
difficulty: easy
minutes: 6
interview: true
tags: [rag, chunking, sliding window]
statement: |
  Before indexing documents for RAG, we cut them into chunks. Write `chunk_words(text, size, overlap)`:

  - split `text` into words with `text.split()`;
  - return a list of chunks, each chunk being **`size` words joined by single spaces**;
  - consecutive chunks share `overlap` words: the window moves forward by `size - overlap` words;
  - stop as soon as a chunk reaches the end of the text (the last chunk may be shorter, never empty);
  - an empty text gives `[]`;
  - if `overlap >= size` or `size <= 0`, raise a `ValueError`.

  ```python
  chunk_words("a b c d e f g", size=3, overlap=1)
  # ['a b c', 'c d e', 'e f g']
  ```
starter: |
  def chunk_words(text, size, overlap):
      pass
solution: |
  def chunk_words(text, size, overlap):
      if size <= 0 or overlap >= size:
          raise ValueError("need 0 <= overlap < size")
      words = text.split()
      step = size - overlap
      chunks = []
      start = 0
      while start < len(words):
          chunks.append(" ".join(words[start:start + size]))
          if start + size >= len(words):
              break
          start += step
      return chunks
tests:
  - call: chunk_words("a b c d e f g", size=3, overlap=1)
    expected: "['a b c', 'c d e', 'e f g']"
  - call: chunk_words("a b c d e f g h", size=3, overlap=1)
    expected: "['a b c', 'c d e', 'e f g', 'g h']"
  - call: chunk_words("one two three", size=5, overlap=2)
    expected: "['one two three']"
  - call: chunk_words("", size=3, overlap=0)
    expected: "[]"
  - call: chunk_words("a  b\n c d", size=2, overlap=0)
    expected: "['a b', 'c d']"
  - name: Invalid parameters raise ValueError
    check: |
      for size, overlap in [(3, 3), (3, 5), (0, 0)]:
          try:
              chunk_words("a b c", size, overlap)
          except ValueError:
              pass
          else:
              raise AssertionError(f"no ValueError for size={size}, overlap={overlap}")
  - name: Every word is covered and chunks overlap correctly
    check: |
      import random
      rng = random.Random(0)
      for _ in range(200):
          words = [f"w{i}" for i in range(rng.randint(1, 40))]
          size = rng.randint(1, 8)
          overlap = rng.randint(0, size - 1)
          chunks = [c.split() for c in chunk_words(" ".join(words), size, overlap)]
          assert chunks and all(chunks), "chunks must not be empty"
          assert chunks[0][0] == words[0] and chunks[-1][-1] == words[-1]
          for a, b in zip(chunks, chunks[1:]):
              assert len(a) == size
              assert a[size - overlap:] == b[:overlap] if overlap else True
          assert sum(len(c) for c in chunks) - overlap * (len(chunks) - 1) == len(words)
    hidden: true
wrong:
  - |
    def chunk_words(text, size, overlap):
        if size <= 0 or overlap >= size:
            raise ValueError("need 0 <= overlap < size")
        words = text.split()
        return [" ".join(words[i:i + size]) for i in range(0, len(words), size - overlap)]
  - |
    def chunk_words(text, size, overlap):
        if size <= 0 or overlap >= size:
            raise ValueError("need 0 <= overlap < size")
        words = text.split()
        return [" ".join(words[i:i + size]) for i in range(0, len(words), size)]
hints:
  - "Work on the list of words. The start of each chunk moves by `step = size - overlap`."
  - "Stop when `start + size >= len(words)`: that chunk already reached the end. A plain `range(0, len(words), step)` adds tiny duplicate chunks at the end."
explanation: |
  - Overlap keeps an idea that straddles a boundary retrievable from at least one chunk.
  - Real systems split on **tokens** and on natural boundaries (headings, paragraphs, sentences) rather than raw words, but the sliding-window logic is the same.
  - The classic bug: `range(0, len(words), step)` produces extra chunks fully contained in the previous one at the end.
