id: dl-backprop
title: Backpropagation d'un MLP à 2 couches
domain: dl
difficulty: hard
minutes: 18
interview: true
tags: [backprop, chain rule, gradients, from scratch]
cards: [dl-backprop-dW, dl-ce-gradient]
statement: |
  Réseau : $H = \text{ReLU}(XW_1 + b_1)$, $Z = HW_2 + b_2$, loss = cross-entropy moyenne entre $\text{softmax}(Z)$ et les labels `y`.

  Écris `loss_and_grads(X, y, W1, b1, W2, b2)` qui renvoie `(loss, grads)` où `grads` est un dict avec les clés `'W1', 'b1', 'W2', 'b2'` (mêmes shapes que les paramètres).

  Chaîne de dérivation :
  1. $dZ = (\text{softmax}(Z) - \text{onehot}(y)) / n$
  2. $dW_2 = H^\top dZ$, $db_2 = \sum_i dZ_i$
  3. $dH = dZ\, W_2^\top$, puis $dA = dH \odot \mathbb{1}[XW_1 + b_1 > 0]$
  4. $dW_1 = X^\top dA$, $db_1 = \sum_i dA_i$
