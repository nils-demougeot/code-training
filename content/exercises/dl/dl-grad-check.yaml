parsons:
  distractors:
    - line: "grad[idx] = (plus - minus) / eps"
      replaces: "grad[idx] = (plus - minus) / (2 * eps)"
hints:
  - "`np.ndindex(w.shape)` parcourt tous les indices d'un tableau de n'importe quelle dimension."
  - "Modifie une coordonnée, évalue, puis **remets la valeur d'origine** avant de passer à la suivante."
  - "Travaille sur une copie (`np.array(w, dtype=float)`) pour ne pas modifier le tableau de l'appelant."
explanation: |
  - Le **gradient checking** est le test unitaire de la backprop : une erreur relative < 1e-7 indique un gradient correct, > 1e-3 un bug.
  - Différences **centrées** : erreur en $O(\epsilon^2)$ contre $O(\epsilon)$ pour les différences avant.
  - Coût : 2 évaluations de `f` par paramètre. Impossible sur un vrai réseau, mais parfait sur une petite couche pour vérifier ses formules (`torch.autograd.gradcheck` fait pareil).
  - Bug classique : oublier de restaurer `w[idx]`, ce qui fausse toutes les coordonnées suivantes.
