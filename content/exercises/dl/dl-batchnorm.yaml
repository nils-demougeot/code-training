id: dl-batchnorm
title: Batch normalization
domain: dl
difficulty: medium
minutes: 10
interview: true
tags: [batchnorm, normalisation, running mean, train vs eval]
statement: |
  Implémente une **BatchNorm** pour des entrées `(batch, features)` sous forme de classe :

  - `BatchNorm(n_features, momentum=0.1, eps=1e-5)` : `gamma` (uns), `beta` (zéros), `running_mean` (zéros) et `running_var` (uns), tableaux de shape `(n_features,)`.
  - `forward(x, training)` :
    - en **entraînement** : normalise avec la moyenne et la variance **du batch** (variance biaisée, `ddof=0`), puis met à jour `running_mean = (1 - momentum) * running_mean + momentum * moyenne_batch` (idem pour `running_var` avec la variance **non biaisée** `ddof=1`, comme PyTorch) ;
    - en **évaluation** : normalise avec `running_mean` et `running_var`.
  - Sortie : `gamma * x_normalisé + beta`, avec $\hat x = \frac{x - \mu}{\sqrt{\sigma^2 + \epsilon}}$.
setup: |
  import numpy as np
  _rng = np.random.default_rng(0)
  BATCHES = [_rng.normal(5, 3, size=(32, 4)) for _ in range(50)]
starter: |
  import numpy as np


  class BatchNorm:
      def __init__(self, n_features, momentum=0.1, eps=1e-5):
          pass

      def forward(self, x, training):
          pass
solution: |
  import numpy as np


  class BatchNorm:
      def __init__(self, n_features, momentum=0.1, eps=1e-5):
          self.gamma = np.ones(n_features)
          self.beta = np.zeros(n_features)
          self.running_mean = np.zeros(n_features)
          self.running_var = np.ones(n_features)
          self.momentum = momentum
          self.eps = eps

      def forward(self, x, training):
          if training:
              mean = x.mean(axis=0)
              var = x.var(axis=0)
              m = self.momentum
              self.running_mean = (1 - m) * self.running_mean + m * mean
              self.running_var = (1 - m) * self.running_var + m * x.var(axis=0, ddof=1)
          else:
              mean, var = self.running_mean, self.running_var
          x_hat = (x - mean) / np.sqrt(var + self.eps)
          return self.gamma * x_hat + self.beta
tests:
  - name: En entraînement, la sortie est centrée réduite
    check: |
      bn = BatchNorm(4)
      out = bn.forward(BATCHES[0], training=True)
      assert out.shape == (32, 4)
      assert np.allclose(out.mean(axis=0), 0, atol=1e-7) and np.allclose(out.std(axis=0), 1, atol=1e-3)
  - name: running_mean et running_var après 1 batch
    call: "(lambda bn: (bn.forward(BATCHES[0], True), bn.running_mean, bn.running_var)[1:])(BatchNorm(4))"
  - name: Statistiques courantes après 50 batches
    check: |
      bn = BatchNorm(4)
      for b in BATCHES:
          bn.forward(b, training=True)
      assert np.allclose(bn.running_mean, 5, atol=0.4) and np.allclose(bn.running_var, 9, atol=1.5), (bn.running_mean, bn.running_var)
  - name: Mode évaluation = statistiques courantes, sans mise à jour
    check: |
      bn = BatchNorm(4)
      bn.forward(BATCHES[0], True)
      rm = bn.running_mean.copy()
      x = BATCHES[1][:3]
      out = bn.forward(x, training=False)
      assert np.array_equal(bn.running_mean, rm), "l'évaluation ne doit pas modifier les statistiques"
      assert np.allclose(out, (x - bn.running_mean) / np.sqrt(bn.running_var + bn.eps))
  - name: gamma et beta sont appliqués
    check: |
      bn = BatchNorm(2)
      bn.gamma, bn.beta = np.array([2.0, 3.0]), np.array([1.0, -1.0])
      out = bn.forward(np.array([[0.0, 0.0], [2.0, 4.0]]), True)
      assert np.allclose(out.mean(axis=0), [1.0, -1.0]) and np.allclose(out.std(axis=0), [2.0, 3.0], atol=1e-4)
wrong:
  - |
    import numpy as np


    class BatchNorm:
        def __init__(self, n_features, momentum=0.1, eps=1e-5):
            self.gamma, self.beta = np.ones(n_features), np.zeros(n_features)
            self.running_mean, self.running_var = np.zeros(n_features), np.ones(n_features)
            self.momentum, self.eps = momentum, eps

        def forward(self, x, training):
            mean, var = x.mean(axis=0), x.var(axis=0)
            m = self.momentum
            self.running_mean = (1 - m) * self.running_mean + m * mean
            self.running_var = (1 - m) * self.running_var + m * x.var(axis=0, ddof=1)
            return self.gamma * (x - mean) / np.sqrt(var + self.eps) + self.beta
  - |
    import numpy as np


    class BatchNorm:
        def __init__(self, n_features, momentum=0.1, eps=1e-5):
            self.gamma, self.beta = np.ones(n_features), np.zeros(n_features)
            self.running_mean, self.running_var = np.zeros(n_features), np.ones(n_features)
            self.momentum, self.eps = momentum, eps

        def forward(self, x, training):
            if training:
                mean, var = x.mean(axis=1, keepdims=True), x.var(axis=1, keepdims=True)
                m = self.momentum
                self.running_mean = (1 - m) * self.running_mean + m * x.mean(axis=0)
                self.running_var = (1 - m) * self.running_var + m * x.var(axis=0, ddof=1)
            else:
                mean, var = self.running_mean, self.running_var
            return self.gamma * (x - mean) / np.sqrt(var + self.eps) + self.beta
parsons:
  distractors:
    - line: "mean = x.mean(axis=1)"
      replaces: "mean = x.mean(axis=0)"
    - line: "self.running_mean = m * self.running_mean + (1 - m) * mean"
      replaces: "self.running_mean = (1 - m) * self.running_mean + m * mean"
hints:
  - "Les statistiques se calculent **par feature**, donc sur l'axe du batch : `axis=0`."
  - "Moyenne exponentielle : `(1 - momentum) * ancien + momentum * nouveau`."
  - "En évaluation, utilise les statistiques courantes et ne les modifie pas : un seul exemple n'a pas de variance."
explanation: |
  - BatchNorm normalise chaque feature sur le batch, puis réapprend une échelle (`gamma`) et un décalage (`beta`). Elle stabilise et accélère l'entraînement des réseaux profonds.
  - Deux comportements : statistiques du **batch** en entraînement, statistiques **courantes** en inférence (où le batch peut contenir un seul exemple).
  - Normaliser sur `axis=1` (chaque exemple sur ses features) donne une **LayerNorm**, celle des Transformers, qui se comporte pareil en train et en eval.
