id: dl-param-count
title: Compter les paramètres d'un réseau
domain: dl
difficulty: easy
minutes: 5
tags: [paramètres, MLP, convolution, large vs profond]
cards: [dl-linear-params, dl-conv-params]
statement: |
  1. `mlp_params(sizes)` : nombre de paramètres (poids + biais) d'un MLP entièrement connecté. `sizes = [784, 128, 10]` signifie entrée 784, une couche cachée de 128, sortie 10.
  2. `conv_params(in_ch, out_ch, k)` : paramètres d'une couche `Conv2d` avec des noyaux `k × k` et un biais par filtre.
  3. `wide_vs_deep()` : renvoie le tuple `(params_large, params_profond)` pour une entrée 100 et une sortie 10 :
     - **large** : une couche cachée de 512 ;
     - **profond** : 4 couches cachées de 64.
starter: |
  def mlp_params(sizes):
      pass


  def conv_params(in_ch, out_ch, k):
      pass


  def wide_vs_deep():
      pass
solution: |
  def mlp_params(sizes):
      return sum(n_in * n_out + n_out for n_in, n_out in zip(sizes[:-1], sizes[1:]))


  def conv_params(in_ch, out_ch, k):
      return out_ch * (in_ch * k * k + 1)


  def wide_vs_deep():
      return mlp_params([100, 512, 10]), mlp_params([100, 64, 64, 64, 64, 10])
tests:
  - call: mlp_params([784, 128, 10])
    expected: "101770"
  - call: mlp_params([2, 1])
    expected: "3"
  - call: conv_params(3, 64, 3)
    expected: "1792"
  - call: wide_vs_deep()
    expected: (56842, 19594)
hints:
  - "Une couche `n_in → n_out` a `n_in * n_out` poids et `n_out` biais."
  - "`zip(sizes[:-1], sizes[1:])` parcourt les paires de couches consécutives."
  - "Un filtre de convolution a `in_ch * k * k` poids (il traverse tous les canaux d'entrée) + 1 biais."
explanation: |
  - `nn.Linear(n_in, n_out)` : `n_in * n_out + n_out` paramètres. En PyTorch : `sum(p.numel() for p in model.parameters())`.
  - Une convolution **partage** ses poids sur toute l'image : 1 792 paramètres pour `Conv2d(3, 64, 3)`, quelle que soit la taille de l'image. Une couche dense sur une image 224×224×3 en aurait des millions.
  - Ici le réseau **profond** a ~3× moins de paramètres que le **large**, et il est souvent plus expressif : la profondeur compose des features. Il est en revanche plus délicat à optimiser.
