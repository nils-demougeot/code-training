id: dl-torch-training-loop
title: La boucle d'entraînement PyTorch
domain: dl
difficulty: medium
minutes: 12
engine: local
interview: true
tags: [PyTorch, training loop, DataLoader, optimizer]
cards: [torch-train-step, torch-no-grad, torch-dataloader]
statement: |
  Écris `train(model, X, y, epochs=30, lr=1e-2, batch_size=32)` qui entraîne `model` sur une classification multi-classe :

  - `X` : tenseur float `(N, d)`, `y` : tenseur d'entiers `(N,)` ;
  - mini-batches **mélangés** avec `TensorDataset` + `DataLoader` ;
  - loss : `nn.CrossEntropyLoss`, optimiseur : `Adam` ;
  - renvoie la liste des **loss moyennes par époque** (floats).

  Puis `accuracy(model, X, y)` : précision en **mode évaluation** et **sans calcul de gradient**.
starter: |
  import torch
  from torch import nn
  from torch.utils.data import DataLoader, TensorDataset


  def train(model, X, y, epochs=30, lr=1e-2, batch_size=32):
      losses = []
      return losses


  def accuracy(model, X, y):
      pass
solution: |
  import torch
  from torch import nn
  from torch.utils.data import DataLoader, TensorDataset


  def train(model, X, y, epochs=30, lr=1e-2, batch_size=32):
      loader = DataLoader(TensorDataset(X, y), batch_size=batch_size, shuffle=True)
      loss_fn = nn.CrossEntropyLoss()
      optimizer = torch.optim.Adam(model.parameters(), lr=lr)
      losses = []
      model.train()
      for _ in range(epochs):
          total = 0.0
          for xb, yb in loader:
              optimizer.zero_grad()
              loss = loss_fn(model(xb), yb)
              loss.backward()
              optimizer.step()
              total += loss.item() * len(xb)
          losses.append(total / len(X))
      return losses


  def accuracy(model, X, y):
      model.eval()
      with torch.no_grad():
          preds = model(X).argmax(dim=1)
      return (preds == y).float().mean().item()
setup: |
  import torch
  from torch import nn
  torch.manual_seed(0)
  N = 600
  t = torch.rand(N) * 3 * 3.1416
  cls = torch.arange(N) % 3
  angle = t + cls * 2.0944
  X = torch.stack([t * torch.cos(angle), t * torch.sin(angle)], dim=1) / 10 + torch.randn(N, 2) * 0.02
  y = cls
  def make_model():
      torch.manual_seed(1)
      return nn.Sequential(nn.Linear(2, 64), nn.ReLU(), nn.Linear(64, 64), nn.ReLU(), nn.Linear(64, 3))
tests:
  - name: La loss diminue
    check: |
      losses = train(make_model(), X, y, epochs=30)
      assert len(losses) == 30, f"{len(losses)} valeurs au lieu de 30"
      assert all(isinstance(l, float) for l in losses), "renvoie des floats Python (loss.item())"
      assert losses[-1] < losses[0] * 0.5, f"loss {losses[0]:.3f} → {losses[-1]:.3f}"
  - name: Apprend les 3 spirales
    check: |
      m = make_model()
      train(m, X, y, epochs=60)
      acc = accuracy(m, X, y)
      assert acc > 0.9, f"accuracy {acc:.2f}"
  - name: accuracy sans gradient et en mode eval
    check: |
      m = make_model()
      m.train()
      accuracy(m, X, y)
      assert not m.training, "accuracy() doit passer le modèle en mode eval"
hints:
  - "`loader = DataLoader(TensorDataset(X, y), batch_size=batch_size, shuffle=True)`."
  - "Les 4 temps de chaque batch : `optimizer.zero_grad()`, `loss = loss_fn(model(xb), yb)`, `loss.backward()`, `optimizer.step()`."
  - "Pour une moyenne par époque : accumule `loss.item() * len(xb)`, puis divise par `len(X)`."
  - "Évaluation : `model.eval()` et `with torch.no_grad():`."
explanation: |
  ```python
  model.train()
  for epoch in range(epochs):
      for xb, yb in loader:
          optimizer.zero_grad()            # 1. remet les gradients à 0 (sinon ils s'accumulent)
          loss = loss_fn(model(xb), yb)    # 2. forward
          loss.backward()                  # 3. backward : calcule les .grad
          optimizer.step()                 # 4. met à jour les poids
  model.eval()
  with torch.no_grad():                    # pas de graphe : plus rapide, moins de mémoire
      preds = model(X_test).argmax(1)
  ```
  - Oublier `zero_grad()` = les gradients **s'additionnent** d'un batch à l'autre.
  - `loss.item()` récupère un float Python : stocker le tenseur garderait tout le graphe en mémoire.
  - Sur GPU : `model.to(device)` et `xb, yb = xb.to(device), yb.to(device)` dans la boucle.
