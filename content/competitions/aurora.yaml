id: aurora
title: Les disparus du Starliner Aurora
emoji: 🚀
difficulty: medium
task: Classification binaire
metric: accuracy
metric_label: Accuracy
higher_is_better: true
shared: comp_aurora
summary: Le paquebot spatial a traversé une anomalie et la moitié des passagers ont disparu. Retrouve qui a été transporté à partir du registre de bord.
story: |
  **An 2912.** Le *Starliner Aurora*, paquebot interstellaire, frôle une anomalie spatio-temporelle en route vers ses trois exoplanètes. Près de la moitié des passagers sont **transportés dans une autre dimension**.

  Les équipes de sauvetage ont récupéré deux registres de bord :

  - `train` : 3 369 passagers dont on sait s'ils ont été transportés (`Transported`) ;
  - `test` : 1 150 autres passagers, **sans** la réponse.

  Ta mission : prédire `Transported` pour chaque passager de `test`. Ta soumission est notée sur la vraie réponse, cachée, avec l'**accuracy** (proportion de bonnes prédictions).
data: |
  | Colonne | Description |
  |---|---|
  | `PassengerId` | `gggg_pp` : numéro du **groupe** (souvent une famille) et rang dans le groupe |
  | `HomePlanet` | planète de départ (`Terre`, `Mars`, `Europe`) |
  | `CryoSleep` | le passager a voyagé en cryosommeil (enfermé dans sa cabine) |
  | `Cabin` | `pont/numéro/côté`, par exemple `B/45/P` ; côté `P` (bâbord) ou `S` (tribord) |
  | `Destination` | exoplanète d'arrivée |
  | `Age` | âge en années |
  | `VIP` | a payé le service VIP |
  | `RoomService`, `FoodCourt`, `ShoppingMall`, `Spa`, `VRDeck` | dépenses à bord, par service |
  | `Transported` | **la cible** : le passager a-t-il été transporté ? (absente de `test`) |

  La constante `SPEND` contient la liste des 5 colonnes de dépenses.
medals:
  bronze: 0.78
  silver: 0.805
  gold: 0.816
