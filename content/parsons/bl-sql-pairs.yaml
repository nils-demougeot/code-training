id: bl-sql-pairs
title: Produits achetés ensemble (auto-jointure)
domain: sql
difficulty: hard
language: sql
shared: sql_shop
statement: |
  Remets dans l'ordre une requête d'**analyse de panier** : les paires de produits achetées dans une même commande, avec le nombre de commandes où la paire apparaît.

  - chaque paire n'apparaît qu'**une fois** (pas de `(A, B)` et `(B, A)`, pas de `(A, A)`) ;
  - colonnes `product_a`, `product_b`, `n_orders` ;
  - les 5 paires les plus fréquentes, départagées par ordre alphabétique.
solution: |
  SELECT p1.name AS product_a, p2.name AS product_b, COUNT(*) AS n_orders
  FROM order_items a
  JOIN order_items b ON a.order_id = b.order_id AND a.product_id < b.product_id
  JOIN products p1 ON p1.id = a.product_id
  JOIN products p2 ON p2.id = b.product_id
  GROUP BY a.product_id, b.product_id
  ORDER BY n_orders DESC, product_a, product_b
  LIMIT 5
tests:
  - name: Résultat de la requête
    call: q(QUERY)
distractors:
  - line: "JOIN order_items b ON a.order_id = b.order_id AND a.product_id <> b.product_id"
    replaces: "JOIN order_items b ON a.order_id = b.order_id AND a.product_id < b.product_id"
  - line: "GROUP BY a.product_id"
    replaces: "GROUP BY a.product_id, b.product_id"
explanation: |
  - Une **auto-jointure** joint une table avec elle-même : ici, deux lignes de `order_items` de la même commande.
  - La condition `a.product_id < b.product_id` garde chaque paire une seule fois et exclut `(A, A)`. Avec `<>`, chaque paire serait comptée deux fois, dans les deux sens.
  - C'est la base des règles d'association (« les clients qui ont acheté X ont aussi acheté Y »), avec le support et la confiance.
