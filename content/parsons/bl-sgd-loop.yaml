id: bl-sgd-loop
title: Boucle d'entraînement par mini-batchs
domain: dl
difficulty: medium
statement: |
  Remets dans l'ordre une **boucle d'entraînement** par descente de gradient stochastique sur mini-batchs, pour une régression linéaire `y ≈ X @ w + b`.

  C'est exactement la structure d'une boucle PyTorch : pour chaque epoch, on **mélange**, on découpe en **batchs**, on calcule la **prédiction**, la **loss**, les **gradients**, puis on **met à jour** les paramètres.

  `train(X, y, lr, epochs, batch_size, seed)` renvoie `(w, b, losses)` où `losses` contient la loss moyenne (MSE) de chaque epoch.
setup: |
  import numpy as np
  _rng = np.random.default_rng(0)
  X = _rng.normal(size=(200, 3))
  y = X @ np.array([2.0, -1.0, 0.5]) + 3.0 + _rng.normal(0, 0.1, 200)
solution: |
  import numpy as np


  def train(X, y, lr=0.05, epochs=30, batch_size=16, seed=0):
      rng = np.random.default_rng(seed)
      n, d = X.shape
      w, b = np.zeros(d), 0.0
      losses = []
      for epoch in range(epochs):
          order = rng.permutation(n)
          epoch_loss = 0.0
          for start in range(0, n, batch_size):
              idx = order[start:start + batch_size]
              xb, yb = X[idx], y[idx]
              err = xb @ w + b - yb
              epoch_loss += float((err ** 2).sum())
              grad_w = 2 * xb.T @ err / len(idx)
              grad_b = 2 * err.mean()
              w -= lr * grad_w
              b -= lr * grad_b
          losses.append(epoch_loss / n)
      return w, b, losses
tests:
  - name: Les poids appris sont proches des vrais
    check: |
      w, b, losses = train(X, y)
      assert np.allclose(w, [2.0, -1.0, 0.5], atol=0.05) and abs(b - 3.0) < 0.05, (w, b)
  - name: Une loss par epoch, qui diminue
    check: |
      w, b, losses = train(X, y, epochs=10)
      assert len(losses) == 10 and losses[-1] < losses[0] / 20, losses
  - name: Résultat exact de la référence
    call: train(X, y, epochs=3)[0]
distractors:
  - line: "order = np.arange(n)"
    replaces: "order = rng.permutation(n)"
  - line: "w += lr * grad_w"
    replaces: "w -= lr * grad_w"
  - line: "grad_w = 2 * xb @ err / len(idx)"
    replaces: "grad_w = 2 * xb.T @ err / len(idx)"
explanation: |
  Le squelette à connaître par cœur, identique en PyTorch :
  ```python
  for epoch in range(epochs):
      for xb, yb in loader:          # mélange + batchs
          pred = model(xb)
          loss = loss_fn(pred, yb)
          optimizer.zero_grad()
          loss.backward()            # gradients
          optimizer.step()           # mise à jour
  ```
  - Mélanger à chaque epoch évite que le modèle voie toujours les batchs dans le même ordre.
  - On **descend** le gradient : `w -= lr * grad`.
