id: bl-knapsack
title: Sac à dos 0/1 et objets choisis
domain: algo
difficulty: hard
statement: |
  Remets dans l'ordre `knapsack(items, capacity)` : `items` est une liste de `(poids, valeur)`, chaque objet peut être pris **au plus une fois**.

  - `dp[i][c]` = meilleure valeur avec les `i` premiers objets et une capacité `c` ;
  - on **reconstruit** ensuite les objets choisis en remontant le tableau.

  Renvoie `(meilleure_valeur, indices_choisis_triés)`.
solution: |
  def knapsack(items, capacity):
      n = len(items)
      dp = [[0] * (capacity + 1) for _ in range(n + 1)]
      for i in range(1, n + 1):
          weight, value = items[i - 1]
          for c in range(capacity + 1):
              dp[i][c] = dp[i - 1][c]
              if weight <= c:
                  dp[i][c] = max(dp[i][c], dp[i - 1][c - weight] + value)
      chosen = []
      c = capacity
      for i in range(n, 0, -1):
          if dp[i][c] != dp[i - 1][c]:
              chosen.append(i - 1)
              c -= items[i - 1][0]
      return dp[n][capacity], sorted(chosen)
tests:
  - call: knapsack([(1, 1), (3, 4), (4, 5), (5, 7)], 7)
  - call: knapsack([(5, 10)], 4)
  - name: Comparaison avec la force brute (sacs aléatoires)
    check: |
      import itertools, random
      rng = random.Random(2)
      for _ in range(150):
          items = [(rng.randint(1, 8), rng.randint(1, 20)) for _ in range(rng.randint(0, 7))]
          cap = rng.randint(0, 20)
          best = 0
          for r in range(len(items) + 1):
              for combo in itertools.combinations(items, r):
                  if sum(w for w, _ in combo) <= cap:
                      best = max(best, sum(v for _, v in combo))
          value, chosen = knapsack(items, cap)
          assert value == best, (items, cap, value, best)
          assert len(set(chosen)) == len(chosen)
          assert sum(items[i][0] for i in chosen) <= cap
          assert sum(items[i][1] for i in chosen) == value
distractors:
  - line: "dp[i][c] = max(dp[i][c], dp[i][c - weight] + value)"
    replaces: "dp[i][c] = max(dp[i][c], dp[i - 1][c - weight] + value)"
  - line: "if weight < c:"
    replaces: "if weight <= c:"
explanation: |
  - Récurrence : `dp[i][c] = max(dp[i-1][c], dp[i-1][c-w] + v)` : on ne prend pas l'objet `i`, ou on le prend une seule fois.
  - Avec `dp[i][c - w]` (même ligne), on pourrait reprendre l'objet plusieurs fois : c'est le sac à dos **non borné**.
  - Si `dp[i][c]` diffère de `dp[i-1][c]`, l'objet `i` a forcément été pris : c'est ainsi qu'on reconstruit la solution.
  - Complexité O(n × capacité) en temps et en mémoire (pseudo-polynomiale).
