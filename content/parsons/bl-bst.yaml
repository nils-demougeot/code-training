id: bl-bst
title: Arbre binaire de recherche
domain: algo
difficulty: medium
statement: |
  Remets dans l'ordre un **arbre binaire de recherche** (ABR) :

  - `insert(root, key)` insère récursivement une clé et renvoie la racine (les doublons sont ignorés) ;
  - `inorder(root)` renvoie les clés dans l'ordre **infixe** (gauche, nœud, droite), donc triées ;
  - `height(root)` renvoie la hauteur (0 pour un arbre vide).
solution: |
  class Node:
      def __init__(self, key):
          self.key = key
          self.left = None
          self.right = None


  def insert(root, key):
      if root is None:
          return Node(key)
      if key < root.key:
          root.left = insert(root.left, key)
      elif key > root.key:
          root.right = insert(root.right, key)
      return root


  def inorder(root):
      if root is None:
          return []
      return inorder(root.left) + [root.key] + inorder(root.right)


  def height(root):
      if root is None:
          return 0
      return 1 + max(height(root.left), height(root.right))
setup: |
  def build(keys):
      root = None
      for k in keys:
          root = insert(root, k)
      return root
tests:
  - name: Parcours infixe trié
    check: |
      assert inorder(build([5, 3, 8, 1, 4, 9, 7])) == [1, 3, 4, 5, 7, 8, 9]
  - name: Doublons ignorés
    check: |
      assert inorder(build([2, 1, 2, 3, 1])) == [1, 2, 3]
  - name: Hauteur
    check: |
      assert height(None) == 0
      assert height(build([1, 2, 3, 4])) == 4
      assert height(build([4, 2, 6, 1, 3, 5, 7])) == 3
  - name: Clés aléatoires
    check: |
      import random
      rng = random.Random(4)
      for _ in range(100):
          keys = [rng.randint(0, 30) for _ in range(rng.randint(0, 20))]
          assert inorder(build(keys)) == sorted(set(keys))
distractors:
  - line: "insert(root.left, key)"
    replaces: "root.left = insert(root.left, key)"
  - line: "return inorder(root.left) + inorder(root.right) + [root.key]"
    replaces: "return inorder(root.left) + [root.key] + inorder(root.right)"
explanation: |
  - Propriété d'un ABR : tout ce qui est à gauche est plus petit, tout ce qui est à droite plus grand. Le parcours **infixe** donne donc les clés triées.
  - `insert` renvoie la racine pour pouvoir **raccrocher** le nouveau nœud : `root.left = insert(root.left, key)`. Sans l'affectation, le nœud créé est perdu.
  - Recherche et insertion en O(h) : O(log n) si l'arbre est équilibré, O(n) s'il dégénère (clés insérées dans l'ordre, cf. le test de hauteur 4).
