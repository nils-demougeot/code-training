id: concepts
title: ML and GenAI, for executives
emoji: 🧠
summary: Explain what a model, an LLM, RAG or overfitting is to people who will never write code, in two sentences and with an analogy.
items:
  - id: what-is-ml
    kind: explain
    audience: "Head of Sales, no technical background"
    prompt: "She asks: **\"What is machine learning, concretely?\"** Which answer do you give?"
    options:
      - text: "\"Instead of writing rules by hand, we show the computer thousands of past examples, for instance deals we won and lost, and it learns the patterns. Then it can score new deals the same way.\""
        verdict: best
        feedback: "Short, concrete, uses her world (deals), and says what it does for her."
      - text: "\"It is a field of AI where algorithms minimise a loss function over training data to approximate an unknown function.\""
        verdict: bad
        feedback: "Accurate but meaningless to her: loss function, approximate an unknown function."
      - text: "\"It is like a human brain inside the computer.\""
        verdict: ok
        feedback: "Simple but misleading: it suggests understanding and intelligence the model does not have."
      - text: "\"It is complicated, but our data scientists handle it.\""
        verdict: bad
        feedback: "Dismissive. Executives fund what they understand."
    takeaway: "Explain ML as learning patterns from past examples, using an example from the listener's own job."
  - id: what-is-llm
    kind: explain
    audience: "CFO of a manufacturing company"
    prompt: "He asks: **\"How does ChatGPT actually work? Does it understand what it says?\"**"
    options:
      - text: "\"It has read a huge amount of text and learned to predict the next word, very well. That makes it great at writing and summarising, but it does not check facts: it produces what sounds right, which is usually, not always, what is right.\""
        verdict: best
        feedback: "Correct mechanism in plain words, plus the practical consequence he needs: it can be fluent and wrong."
      - text: "\"It's a transformer with billions of parameters trained with self-attention and reinforcement learning from human feedback.\""
        verdict: bad
        feedback: "Jargon. He wanted to know whether he can trust it."
      - text: "\"Yes, it understands like a person, just faster.\""
        verdict: bad
        feedback: "False, and dangerous: it leads to blind trust."
      - text: "\"Nobody really knows how it works.\""
        verdict: ok
        feedback: "There is some truth about interpretability, but it is unhelpful and sounds evasive."
    takeaway: "LLM in one line: it predicts the next word extremely well; fluent is not the same as correct."
  - id: rag
    kind: explain
    audience: "Head of Customer Service at a telecom company"
    prompt: "Your team proposes a RAG assistant. She asks: **\"What is the difference with just using ChatGPT?\"**"
    options:
      - text: "\"ChatGPT answers from memory, and its memory does not contain your procedures. Our assistant first looks up the relevant pages in your own documents, then answers from them and shows which page it used, so your agents can check.\""
        verdict: best
        feedback: "The key idea (look up first, then answer), the benefit (your documents, current) and the trust mechanism (sources)."
      - text: "\"We use embeddings and a vector database to retrieve chunks, which we inject into the prompt of the LLM.\""
        verdict: bad
        feedback: "Five technical terms, zero benefit stated."
      - text: "\"It's ChatGPT, but trained on your data.\""
        verdict: ok
        feedback: "Close enough to be understood, but wrong on the mechanism ('trained'), which creates false expectations about updates and privacy."
      - text: "\"It's much better, trust us.\""
        verdict: bad
        feedback: "No explanation, no reason to trust."
    takeaway: "RAG = an open-book exam: the assistant looks up your documents first, then answers and cites them."
  - id: overfitting
    kind: explain
    audience: "Marketing director"
    prompt: "Your model was excellent on past data but disappointing on the new campaign. She asks why. How do you explain overfitting?"
    options:
      - text: "\"The model memorised the past instead of learning general rules, like a student who learns last year's exam answers by heart and fails when the questions change. We now check models on data they have never seen.\""
        verdict: best
        feedback: "A vivid analogy, an honest admission, and what you do about it."
      - text: "\"The model overfitted because of high variance; we need more regularisation.\""
        verdict: bad
        feedback: "Correct diagnosis in a language she cannot use."
      - text: "\"The market changed, it is not the model's fault.\""
        verdict: ok
        feedback: "Drift can happen, but blaming the market without checking sounds defensive."
      - text: "\"Models sometimes don't work.\""
        verdict: bad
        feedback: "Unhelpful, and it undermines trust in the whole project."
    takeaway: "Overfitting = learning last year's exam by heart. Prove performance on data the model never saw."
  - id: probability
    kind: explain
    audience: "Store manager"
    prompt: "The tool says a customer has a **70 % churn risk**. The manager asks: \"So will she leave or not?\""
    options:
      - text: "\"We can't know for one person. It means that out of 10 customers like her, about 7 leave if we do nothing. So she is worth a call, but some of the customers we call would have stayed anyway.\""
        verdict: best
        feedback: "Turns a probability into frequencies (7 out of 10), which people understand far better, and links it to the action."
      - text: "\"Yes, she will leave.\""
        verdict: bad
        feedback: "Turns a probability into a certainty; the manager will lose trust the first time she stays."
      - text: "\"The posterior probability of the positive class is 0.7.\""
        verdict: bad
        feedback: "Technically right, practically useless."
      - text: "\"It's more likely than not.\""
        verdict: ok
        feedback: "True but vague: '7 out of 10' is much more concrete."
    takeaway: "Translate probabilities into natural frequencies: '7 out of 10 customers like her'."
  - id: training-data
    kind: explain
    audience: "Plant director"
    prompt: "He asks: **\"Why do you need two years of history? Can't the AI just start today?\"**"
    options:
      - text: "\"The model learns from examples of what happened before a breakdown. We have only about 40 breakdowns a year, so two years gives us roughly 80 examples, which is the minimum to see a reliable pattern and to test it honestly.\""
        verdict: best
        feedback: "Explains why with his own numbers, and introduces the idea of testing."
      - text: "\"Because deep learning needs big data.\""
        verdict: bad
        feedback: "A slogan, not an explanation, and not even the real reason here."
      - text: "\"More data is always better.\""
        verdict: ok
        feedback: "Partly true, but it does not explain why two years is the right amount."
      - text: "\"That's how it works.\""
        verdict: bad
        feedback: "No reason given."
    takeaway: "Explain data needs in terms of examples of the event you want to predict, with the client's own numbers."
  - id: hallucination
    kind: explain
    audience: "General counsel (legal director)"
    prompt: "She read that GenAI \"hallucinates\". She asks what that means and whether it is a problem for a contract assistant."
    options:
      - text: "\"It means the model sometimes writes confident sentences that are false, for instance a clause that is not in the contract. That's why our assistant only answers from the contract itself, quotes the exact clause, and says when it cannot find one; a lawyer still validates.\""
        verdict: best
        feedback: "Defines the risk plainly, gives a concrete legal example, and explains the safeguards."
      - text: "\"Hallucinations are rare with the latest models, don't worry.\""
        verdict: bad
        feedback: "Dismissive, and false comfort for a legal use case."
      - text: "\"It's a known issue with stochastic decoding in autoregressive models.\""
        verdict: bad
        feedback: "Jargon that avoids the question."
      - text: "\"Yes, it's a big problem, so we can't use GenAI for contracts.\""
        verdict: ok
        feedback: "Takes the risk seriously but ignores the design choices that make it manageable."
    takeaway: "Hallucination = confident, made-up content. Answer with the mitigation: sources, quotes, 'I don't know', human review."
write:
  - id: explain-ml-model
    audience: "Head of Sales, no technical background"
    prompt: "In **at most 60 words**, explain what the churn model you built does and how her team should use it."
    maxWords: 60
    checklist:
      - "I said what it does for her team, not how it works inside"
      - "I used an example from her world (customers, calls, contracts)"
      - "I gave a concrete action for her team"
      - "I was honest that it is sometimes wrong"
      - "No jargon left (check the detector)"
    model: "Every Monday, the tool ranks your customers by how likely they are to leave in the next three months. Call the top 50 first. Out of 10 customers it flags, about 6 would really leave, so some calls will reach happy customers, and that is fine."
  - id: explain-genai-limits
    audience: "CEO of a retail company"
    prompt: "In **at most 70 words**, explain what a GenAI assistant can and cannot do reliably for his customer service."
    maxWords: 70
    checklist:
      - "I gave one thing it does well, with an example"
      - "I gave one thing it does badly, with an example"
      - "I explained how we keep it safe"
      - "It sounds like something I would say out loud"
    model: "It is excellent at drafting answers, summarising long emails and finding information in your own documents. It is not reliable on facts it cannot look up, like a delivery date, and it can make things up with confidence. So we connect it to your order data, make it show its sources, and keep an agent in charge of refunds."
