id: pushback
title: Handling client pushback
emoji: 🛡️
summary: Stay calm and useful when the client doubts the model, wants it faster, or asks for the impossible.
items:
  - id: not-perfect
    kind: pushback
    audience: "Operations director, irritated"
    prompt: "\"Your model got three orders completely wrong last week. **How can I trust it?**\""
    options:
      - text: "\"You're right to check, thanks for flagging them. Let's look at those three together. Over the last month it beat the manual estimate on 8 days out of 10, and your team keeps the final say on unusual cases.\""
        verdict: best
        feedback: "Acknowledge, investigate the concrete cases, put them in perspective with evidence, and keep the human in control."
      - text: "\"No model is ever perfect, and you have to accept some errors if you want the benefits. The important thing is the average over many orders, and on average the model does better than before.\""
        verdict: ok
        feedback: "True, but it sounds defensive and ignores his three concrete cases; he will not feel heard."
      - text: "\"Those three orders were outliers: statistically, a few extreme errors are expected and they don't change the overall performance, which is still within the targets we all agreed on together at the start of the project.\""
        verdict: bad
        feedback: "Dismisses his experience with statistics. For him, three bad orders matter, and you have not even looked at them."
      - text: "\"We checked the model carefully and it behaves as designed, so the problem most likely comes from the data your systems sent us that week. Could your IT team check the input files for those three days?\""
        verdict: bad
        feedback: "Blaming the client's data before investigating destroys trust, and you do not know it yet."
    takeaway: "Acknowledge → look at the concrete cases → put them in perspective with evidence → keep humans in control."
  - id: just-chatgpt
    kind: pushback
    audience: "CEO"
    prompt: "\"Why do we need a 10-week project? **My nephew built a chatbot with ChatGPT in a weekend.**\""
    options:
      - text: "\"A weekend demo is realistic, and a great way to see the potential. The 10 weeks go into what a demo skips: your real data, tests on hundreds of real questions, protecting customer data, and handling the cases where it's wrong.\""
        verdict: best
        feedback: "Agrees with what is true, then explains concretely where the time goes, in terms of risk he cares about."
      - text: "\"With respect, your nephew's chatbot is a toy: it isn't enterprise-grade, it isn't scalable and it isn't secure. Our solution follows industry best practices and our own quality standards, which is why it takes longer to build properly.\""
        verdict: bad
        feedback: "Condescending, and 'enterprise-grade' and 'best practices' explain nothing he can weigh."
      - text: "\"You have a point, the tools have become very fast. If we focus on the essentials and skip some of the testing, we can probably deliver something similar in two weeks and improve it after launch.\""
        verdict: bad
        feedback: "Caving to pressure leads to a fragile system and a much worse conversation later, when it fails in front of customers."
      - text: "\"There are many technical complexities behind a production system that you might not see from the outside: integration, security, scalability, monitoring… All of that takes time to do right.\""
        verdict: ok
        feedback: "True but generic; name the complexities in his terms and tie them to risks he cares about."
    takeaway: "Demo vs product: name what the demo skips (real data, testing, security, failure handling) in business terms."
  - id: black-box
    kind: pushback
    audience: "Head of Credit Risk at a bank"
    prompt: "\"I can't approve a **black box**. If a customer asks why their loan was refused, what do we say?\""
    options:
      - text: "\"Fair requirement, and regulators share it. For each decision we can show the main factors, like income stability or existing debt, and pick a simpler model if the gain is small. Let's agree the explanation format with your team.\""
        verdict: best
        feedback: "Validates the concern, gives a concrete way to explain decisions, and is willing to trade some performance for transparency."
      - text: "\"I understand, but the model is too complex to explain decision by decision: that's the price of its accuracy. What matters is that, overall, it refuses fewer good customers than your current scorecard does.\""
        verdict: bad
        feedback: "Unacceptable in credit decisions, and it confirms her fear."
      - text: "\"No problem: we can compute SHAP values for each prediction, which decompose the score into additive feature contributions, and plot them for your analysts in an interactive dashboard displayed next to each credit application.\""
        verdict: ok
        feedback: "A real technique, but named instead of explained: what will the customer actually hear when they ask why?"
      - text: "\"In practice, customers rarely ask why their loan was refused, and advisors can always give a general answer about the bank's credit policy. So I wouldn't let this block the project at this stage.\""
        verdict: bad
        feedback: "Dismisses a legal and ethical obligation."
    takeaway: "On explainability: validate, show what an explanation will look like for one decision, and consider simpler models."
  - id: hundred-percent
    kind: pushback
    audience: "Head of Claims"
    prompt: "\"I want the email routing to be **100 % accurate**, otherwise we don't go live.\""
    options:
      - text: "\"I understand: a misrouted urgent email is serious. Today's manual routing is about 92 % right. We'd route automatically only when the model is very confident, about 70 % of emails at around 99 %, and send the rest to your team.\""
        verdict: best
        feedback: "Takes the concern seriously, compares with today's real baseline, and designs around it with a confidence threshold."
      - text: "\"I have to be honest with you: 100 % is impossible for any system, human or AI. Every model makes some mistakes, so if that really is the requirement, the project can't meet it and we should discuss together whether it makes sense to continue.\""
        verdict: ok
        feedback: "Honest, but it ends the conversation instead of solving her real concern."
      - text: "\"Understood, we'll get there: with enough training data and a few more iterations on the model, we're confident we can reach 100 % accuracy before go-live, and we'll keep testing until we do.\""
        verdict: bad
        feedback: "A promise you cannot keep."
      - text: "\"If you need 100 % accuracy, then AI isn't the right tool for this process, and it's better to keep the routing fully manual. We could look for other use cases where some errors are acceptable instead.\""
        verdict: bad
        feedback: "Gives up on a solvable problem: a confidence threshold handles exactly this concern."
    takeaway: "Against '100 % or nothing': compare with today's real error rate, and automate only the confident cases."
  - id: data-is-fine
    kind: pushback
    audience: "IT director"
    prompt: "You found that 15 % of customer records have the wrong region. He says: \"**Our data is perfectly clean**, the problem must be your code.\""
    options:
      - text: "\"It may well be on our side, so let's check together. Here are five records where the CRM region doesn't match the postcode. If they're errors, we can size the issue and decide whether to fix it at the source or in our pipeline.\""
        verdict: best
        feedback: "Non-confrontational, evidence-based with concrete examples, and moves toward a joint decision."
      - text: "\"I'm afraid it isn't our code: we checked it three times, and 15 % of your customer records really do have the wrong region. Your data needs a serious cleaning effort by your team before the model can work properly on it.\""
        verdict: bad
        feedback: "Even if you are right, you create a fight with someone whose help you need, and you show no evidence."
      - text: "\"Okay, understood. We'll go back and review our code and our pipeline in detail, and we'll come back to you if we find anything. Sorry for the confusion, and thanks for your patience.\""
        verdict: ok
        feedback: "Polite, but you let a real data problem go unaddressed and lose the chance to fix it together."
      - text: "\"Data quality issues are very common in large organisations, especially when several systems feed the CRM over the years. It's nobody's fault, but it usually explains this kind of discrepancy.\""
        verdict: bad
        feedback: "Generic, and he still hears an accusation, without a single concrete example."
    takeaway: "Disagree with data, not with people: bring a few concrete examples and propose to check together."
  - id: replace-jobs
    kind: pushback
    audience: "Team leader of the claims handlers, worried"
    prompt: "\"Be honest with me: **is this AI going to replace my team?**\""
    options:
      - text: "\"I understand the worry. This takes over the sorting and copying your team says costs an hour a day, so they spend more time on complex claims and customers. Claim decisions stay with your handlers, and we want your team to test it.\""
        verdict: best
        feedback: "Empathy, a concrete and honest description of the scope, and involvement of the team."
      - text: "\"No, absolutely not: AI never replaces people, it only helps them. Nobody in your team will lose their job because of this project, you have my word on that, so you can reassure every member of your team today and stop worrying about it.\""
        verdict: ok
        feedback: "Reassuring, but a blanket promise you cannot make on the company's behalf; honesty about the scope is more credible."
      - text: "\"That's a question for management rather than for me: decisions about the organisation are not part of our scope. I'd suggest you raise it with your director at the next team meeting.\""
        verdict: bad
        feedback: "Avoids the question and loses the team's trust, and their help."
      - text: "\"Possibly some roles will change, but productivity gains are good for the whole company in the long run, and the people who learn to work with AI will be the most valuable ones in a few years.\""
        verdict: bad
        feedback: "Tone-deaf. The team will resist the project."
    takeaway: "Be honest about the scope (which tasks change), keep humans in charge of decisions, and involve the users."
  - id: faster
    kind: pushback
    audience: "Managing director, under board pressure"
    prompt: "\"Skip the pilot. **Roll it out to all 120 stores next month.**\""
    options:
      - text: "\"I see the pressure. Without a pilot, if something is off, all 120 stores feel it at once and we can't prove the value. Option: 20 stores next month, compared with the others for 6 weeks, then all stores.\""
        verdict: best
        feedback: "Acknowledges the pressure, names the risk in his terms, and offers a faster compromise that still measures."
      - text: "\"I'm sorry, but our methodology requires a pilot phase before any full rollout: it's a standard step in every project we run, and skipping it would go against our quality process.\""
        verdict: bad
        feedback: "Hides behind process instead of explaining the risk he would be taking."
      - text: "\"Understood, if the board needs it, let's do it: we'll prepare the rollout to all 120 stores for next month and monitor every store closely, fixing any issues as they come up during the first few weeks of operation.\""
        verdict: bad
        feedback: "You take on all the risk and lose the ability to show the value with a comparison group."
      - text: "\"It's risky: if something goes wrong, every store is affected at the same time and it will be hard to measure the real impact. But it's your decision, and we'll support whatever you choose.\""
        verdict: ok
        feedback: "Honest about the risk, but you could have offered a better option that meets his deadline."
    takeaway: "Under time pressure, offer a faster version that keeps a comparison group, framed as protecting the result."
write:
  - id: write-black-box
    audience: "Head of Credit Risk"
    prompt: "She says: \"I don't trust models I can't understand.\" In **at most 70 words**, answer her."
    maxWords: 70
    checklist:
      - "I acknowledged that her concern is legitimate"
      - "I described what an explanation would concretely look like"
      - "I offered a trade-off or a next step"
      - "I stayed calm and did not lecture"
    model: "That's a fair requirement, especially for credit decisions. For each customer, we can show the three factors that weighed most, for example 'high existing debt', in words your advisors can repeat. If a simpler model is almost as good, we will choose it. Could we review ten real decisions with your team next week?"
  - id: write-faster
    audience: "CEO who wants the project done in half the time"
    prompt: "He asks to cut the 12-week plan to 6 weeks. In **at most 70 words**, answer him."
    maxWords: 70
    checklist:
      - "I acknowledged his goal"
      - "I explained what would be lost or at risk, in business terms"
      - "I proposed an alternative that gives him something sooner"
    model: "I understand you need results quickly. In 6 weeks we can deliver a working version on one product line, tested on real data, so you have something concrete to show. The other 6 weeks are what make it safe to extend everywhere. Cutting them means going live without knowing how often it is wrong."
