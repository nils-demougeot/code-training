domain: numpy
questions:
  - id: q-np-axis0-shape
    topic: Axes
    verify: true
    question: Qu'affiche ce code ?
    code: |
      import numpy as np
      a = np.arange(12).reshape(3, 4)
      print(a.sum(axis=0).shape)
    choices: ["(3,)", "(4,)", "(3, 1)", "(1, 4)"]
    answer: 1
    explain: "`axis=0` **écrase les lignes** : il reste un résultat par colonne, donc `(4,)`."
  - id: q-np-keepdims
    topic: Axes
    verify: true
    question: Qu'affiche ce code ?
    code: |
      import numpy as np
      a = np.ones((3, 4))
      print(a.mean(axis=1, keepdims=True).shape)
    choices: ["(3,)", "(4,)", "(3, 1)", "(1, 4)"]
    answer: 2
    explain: "`keepdims=True` garde l'axe réduit avec une taille 1, pour que le résultat se broadcast contre `a`."
  - id: q-np-broadcast-error
    topic: Broadcasting
    verify: true
    question: Que se passe-t-il ?
    code: |
      import numpy as np
      X = np.ones((4, 3))
      row_means = X.mean(axis=1)
      print((X - row_means).shape)
    choices: ["(4, 3)", "(4,)", "ValueError", "(3, 4)"]
    answer: 2
    explain: "`(4, 3) - (4,)` : aligné à droite, 3 ≠ 4, broadcasting impossible. Il fallait `keepdims=True` ou `row_means[:, None]`."
  - id: q-np-outer
    topic: Broadcasting
    verify: true
    question: Qu'affiche ce code ?
    code: |
      import numpy as np
      a = np.arange(3)[:, None]
      b = np.arange(4)
      print((a + b).shape)
    choices: ["(3,)", "(4,)", "(3, 4)", "ValueError"]
    answer: 2
    explain: "`(3, 1) + (4,)` → `(3, 1) + (1, 4)` → `(3, 4)`. C'est l'astuce du produit extérieur."
  - id: q-np-view
    topic: Vues et copies
    verify: true
    question: Qu'affiche ce code ?
    code: |
      import numpy as np
      a = np.arange(5)
      b = a[1:3]
      b[0] = 99
      print(a)
    choices: ["[0 1 2 3 4]", "[ 0 99  2  3  4]", "[99  1  2  3  4]", "[ 0 99 99  3  4]"]
    answer: 1
    explain: "Le slicing NumPy renvoie une **vue** : modifier `b` modifie `a`. Utilise `.copy()` pour une copie indépendante (contrairement aux listes Python)."
  - id: q-np-fancy-copy
    topic: Vues et copies
    verify: true
    question: Qu'affiche ce code ?
    code: |
      import numpy as np
      a = np.arange(5)
      b = a[[1, 2]]
      b[0] = 99
      print(a)
    choices: ["[0 1 2 3 4]", "[ 0 99  2  3  4]", "[99  1  2  3  4]", "IndexError"]
    answer: 0
    explain: "L'indexation par **liste d'indices** (fancy indexing) ou par **masque** renvoie une **copie**, contrairement au slicing."
  - id: q-np-int-dtype
    topic: dtype
    verify: true
    question: Qu'affiche ce code ?
    code: |
      import numpy as np
      a = np.array([1, 2, 3])
      a[0] = 2.7
      print(a)
    choices: ["[2.7 2.  3. ]", "[2 2 3]", "[3 2 3]", "TypeError"]
    answer: 1
    explain: "Le dtype d'un tableau est **fixe** (ici entier) : 2.7 est tronqué en 2 sans avertissement. Crée le tableau en float dès le départ."
  - id: q-np-and
    topic: Masques
    verify: true
    question: Que se passe-t-il ?
    code: |
      import numpy as np
      a = np.array([1, 5, 10])
      print(a[a > 2 and a < 8])
    choices: ["[5]", "[5 10]", "ValueError", "[]"]
    answer: 2
    explain: "`and` exige un booléen unique, or `a > 2` est un tableau : `ValueError: The truth value of an array ... is ambiguous`. Utilise `(a > 2) & (a < 8)`."
  - id: q-np-matmul-vs-mul
    topic: Opérations
    verify: true
    question: Qu'affiche ce code ?
    code: |
      import numpy as np
      A = np.array([[1, 2], [3, 4]])
      print((A * A)[0, 1], (A @ A)[0, 1])
    choices: ["4 10", "10 4", "4 4", "10 10"]
    answer: 0
    explain: "`*` : produit **élément par élément** (2×2 = 4). `@` : produit **matriciel** (1×2 + 2×4 = 10)."
  - id: q-np-reshape-order
    topic: Reshape
    verify: true
    question: Qu'affiche ce code ?
    code: |
      import numpy as np
      print(np.arange(6).reshape(2, 3)[:, 1])
    choices: ["[1 4]", "[3 4 5]", "[1 2]", "[2 3]"]
    answer: 0
    explain: "`reshape(2, 3)` remplit ligne par ligne : `[[0 1 2], [3 4 5]]`. La colonne 1 contient `[1 4]`."
  - id: q-np-argmax
    topic: Indices
    verify: true
    question: Qu'affiche ce code ?
    code: |
      import numpy as np
      P = np.array([[0.1, 0.7, 0.2], [0.5, 0.3, 0.2]])
      print(P.argmax(axis=1))
    choices: ["[1 0]", "[0.7 0.5]", "[0 1]", "1"]
    answer: 0
    explain: "`argmax(axis=1)` donne l'**indice** du max de chaque ligne : c'est la classe prédite."
  - id: q-np-nan
    topic: NaN
    verify: true
    question: Qu'affiche ce code ?
    code: |
      import numpy as np
      x = np.array([1.0, np.nan, 3.0])
      print(x.mean(), np.nanmean(x))
    choices: ["2.0 2.0", "nan 2.0", "1.33 2.0", "nan nan"]
    answer: 1
    explain: "Un NaN « contamine » les calculs. `np.nanmean`, `np.nansum`… les ignorent. Pandas, lui, ignore les NaN par défaut (`skipna=True`)."
  - id: q-np-1d-transpose
    topic: Shapes
    verify: true
    question: Qu'affiche ce code ?
    code: |
      import numpy as np
      v = np.array([1, 2, 3])
      print(v.T.shape)
    choices: ["(3, 1)", "(1, 3)", "(3,)", "ValueError"]
    answer: 2
    explain: "Transposer un tableau 1D ne fait **rien** : il n'a qu'un axe. Pour une colonne : `v[:, None]` ou `v.reshape(-1, 1)`."
  - id: q-np-broadcast-shape
    topic: Broadcasting
    verify: true
    question: Qu'affiche ce code ?
    code: |
      import numpy as np
      a = np.ones((4, 1, 3))
      b = np.ones((5, 1))
      print((a + b).shape)
    choices: ["(4, 5, 3)", "(4, 1, 3)", "ValueError", "(5, 4, 3)"]
    answer: 0
    explain: "On aligne les shapes **à droite** : `(4, 1, 3)` et `(_, 5, 1)`. Chaque dimension 1 s'étend : résultat `(4, 5, 3)`."
  - id: q-np-integer-division
    topic: dtype
    verify: true
    question: Qu'affiche ce code ?
    code: |
      import numpy as np
      a = np.array([1, 2, 3])
      a[0] = 2.9
      print(a)
    choices: ["[2 2 3]", "[2.9 2.  3. ]", "[3 2 3]", "TypeError"]
    answer: 0
    explain: "Un tableau a un dtype **fixe** : affecter un float dans un tableau d'entiers le **tronque** silencieusement."
  - id: q-np-sum-bool
    topic: Masques
    verify: true
    question: Qu'affiche ce code ?
    code: |
      import numpy as np
      x = np.array([3, -1, 4, -1, 5])
      print((x > 0).sum(), (x > 0).mean(), x[x > 0].sum())
    choices: ["3 0.6 12", "12 0.6 3", "3 3.0 12", "3 0.6 3"]
    answer: 0
    explain: "Un masque booléen se somme comme des 0/1 (nombre de vrais) et sa moyenne est une proportion."
  - id: q-np-arange-float
    topic: Création
    verify: true
    question: Qu'affiche ce code ?
    code: |
      import numpy as np
      print(len(np.arange(0, 1, 0.1)), len(np.linspace(0, 1, 10)), np.linspace(0, 1, 5)[1])
    choices: ["10 10 0.25", "11 10 0.2", "10 11 0.25", "10 10 0.2"]
    answer: 0
    explain: "`arange` exclut la borne de fin et prend un **pas** ; `linspace` inclut les deux bornes et prend un **nombre de points**."
  - id: q-np-squeeze-newaxis
    topic: Shapes
    verify: true
    question: Qu'affiche ce code ?
    code: |
      import numpy as np
      v = np.arange(3)
      print(v[:, None].shape, v[None, :].shape, np.zeros((1, 3, 1)).squeeze().shape)
    choices: ["(3, 1) (1, 3) (3,)", "(1, 3) (3, 1) (3,)", "(3, 1) (1, 3) (1, 3)", "(3,) (3,) (3,)"]
    answer: 0
    explain: "`None` (alias `np.newaxis`) ajoute un axe de taille 1 à l'endroit indiqué ; `squeeze` retire tous les axes de taille 1."
  - id: q-np-argsort-twice
    topic: Tri
    verify: true
    question: Qu'affiche ce code ?
    code: |
      import numpy as np
      x = np.array([30, 10, 20])
      print(np.argsort(x), np.argsort(np.argsort(x)))
    choices: ["[1 2 0] [2 0 1]", "[2 0 1] [1 2 0]", "[1 2 0] [1 2 0]", "[0 1 2] [2 0 1]"]
    answer: 0
    explain: "`argsort` donne les indices qui trient le tableau ; appliqué deux fois, il donne le **rang** de chaque élément (30 est 3e → rang 2)."
  - id: q-np-where-three
    topic: Sélection
    verify: true
    question: Qu'affiche ce code ?
    code: |
      import numpy as np
      x = np.array([-2, 0, 3])
      print(np.where(x > 0, x, 0), np.where(x > 0)[0])
    choices: ["[0 0 3] [2]", "[0 0 3] [3]", "[3] [2]", "[-2 0 3] [2]"]
    answer: 0
    explain: "Avec 3 arguments, `np.where` choisit élément par élément ; avec 1 seul, il renvoie un tuple des **indices** où la condition est vraie."
  - id: q-np-aggregate-axis-none
    topic: Axes
    verify: true
    question: Qu'affiche ce code ?
    code: |
      import numpy as np
      m = np.array([[1, 2], [3, 4]])
      print(m.max(), m.max(axis=0), m.argmax())
    choices: ["4 [3 4] 3", "4 [2 4] 3", "4 [3 4] (1, 1)", "[2 4] [3 4] 3"]
    answer: 0
    explain: "Sans `axis`, l'agrégation porte sur tout le tableau ; `argmax` renvoie alors un indice **à plat**. `np.unravel_index(3, m.shape)` donne `(1, 1)`."
  - id: q-np-float-equality
    topic: Égalité
    verify: true
    question: Qu'affiche ce code ?
    code: |
      import numpy as np
      a = np.array([0.1 + 0.2])
      print(a == 0.3, np.isclose(a, 0.3), np.allclose(a, [0.3]))
    choices: ["[False] [ True] True", "[ True] [ True] True", "[False] [False] False", "False True True"]
    answer: 0
    explain: "Les flottants ne se comparent pas avec `==` : `np.isclose` (élément par élément) et `np.allclose` (un booléen) utilisent une tolérance."
  - id: q-np-random-seed
    topic: Aléatoire
    verify: true
    question: Qu'affiche ce code ?
    code: |
      import numpy as np
      a = np.random.default_rng(42).integers(0, 100, 3)
      b = np.random.default_rng(42).integers(0, 100, 3)
      rng = np.random.default_rng(42)
      c, d = rng.integers(0, 100, 3), rng.integers(0, 100, 3)
      print((a == b).all(), (c == d).all())
    choices: ["True False", "True True", "False False", "False True"]
    answer: 0
    explain: "Même seed → même séquence. Mais deux tirages successifs d'un **même** générateur avancent dans la séquence et diffèrent."
