domain: ml
questions:
  - id: q-ml-scaling-needed
    topic: Prétraitement
    question: Quel modèle n'est PAS sensible à l'échelle des features ?
    choices: ["k plus proches voisins", "SVM à noyau RBF", "Random Forest", "Régression logistique régularisée"]
    answer: 2
    explain: "Les arbres découpent selon des **seuils** sur une feature à la fois : multiplier une feature par 1000 ne change pas les découpages possibles."
  - id: q-ml-imbalanced-metric
    topic: Métriques
    question: "Détection de fraude : 0,5 % de positifs. Quelle métrique est la MOINS adaptée ?"
    choices: ["Accuracy", "Recall", "F1", "PR AUC"]
    answer: 0
    explain: "Un modèle qui prédit toujours « pas de fraude » a 99,5 % d'accuracy… et ne sert à rien."
  - id: q-ml-overfit-symptom
    topic: Biais-variance
    question: "Train : 99 % d'accuracy. Validation : 72 %. Diagnostic ?"
    choices: ["Underfitting (biais élevé)", "Overfitting (variance élevée)", "Data leakage", "Learning rate trop petit"]
    answer: 1
    explain: "Grand écart train/validation = le modèle mémorise le train. Remèdes : régularisation, plus de données, modèle plus simple."
  - id: q-ml-leakage
    topic: Fuite de données
    question: Lequel de ces procédés provoque une fuite de données ?
    choices: ["Standardiser avec un scaler fit sur le train uniquement", "Faire une sélection de features sur tout le dataset avant la validation croisée", "Utiliser un Pipeline dans GridSearchCV", "Stratifier le split sur y"]
    answer: 1
    explain: "La sélection a « vu » les labels du jeu de validation : le score de CV sera trop optimiste. Mets la sélection **dans** le pipeline."
  - id: q-ml-knn-k1
    topic: Modèles
    question: "Un kNN avec k = 1 évalué sur son propre jeu d'entraînement a une accuracy de…"
    choices: ["~50 %", "100 % (sauf doublons de labels différents)", "Égale à celle du test", "Impossible à dire"]
    answer: 1
    explain: "Chaque point est son propre plus proche voisin. C'est l'exemple typique de variance maximale."
  - id: q-ml-l1
    topic: Régularisation
    question: Quelle régularisation met des coefficients exactement à zéro ?
    choices: ["L2 (Ridge)", "L1 (Lasso)", "Dropout", "Early stopping"]
    answer: 1
    explain: "La pénalité $|w|$ a un « coin » en 0 qui pousse les petits poids à exactement zéro : une sélection de features automatique."
  - id: q-ml-bagging
    topic: Ensembles
    question: "Que réduit principalement le bagging (Random Forest) ?"
    choices: ["Le biais", "La variance", "Le temps d'entraînement", "Le nombre de features"]
    answer: 1
    explain: "Moyenner des modèles instables entraînés sur des échantillons bootstrap réduit la variance. Le boosting, lui, réduit surtout le biais."
  - id: q-ml-cv-time
    topic: Validation
    question: "Prédire les ventes du mois prochain : quelle validation utiliser ?"
    choices: ["KFold avec shuffle=True", "StratifiedKFold", "TimeSeriesSplit", "LeaveOneOut"]
    answer: 2
    explain: "On ne doit jamais entraîner sur le futur pour prédire le passé. `TimeSeriesSplit` respecte l'ordre chronologique."
  - id: q-ml-logreg-C
    topic: scikit-learn
    question: "Dans LogisticRegression de scikit-learn, diminuer C…"
    choices: ["Diminue la régularisation", "Augmente la régularisation", "Augmente le nombre d'itérations", "Change la fonction de perte"]
    answer: 1
    explain: "`C` est l'**inverse** de la force de régularisation (C = 1/λ). Petit C = modèle plus contraint."
  - id: q-ml-predict-proba
    topic: scikit-learn
    verify: true
    question: Qu'affiche ce code ?
    code: |
      import numpy as np
      from sklearn.linear_model import LogisticRegression
      X = np.array([[0.], [1.], [2.], [3.]])
      y = np.array([0, 0, 1, 1])
      print(LogisticRegression().fit(X, y).predict_proba(X).shape)
    choices: ["(4,)", "(4, 1)", "(4, 2)", "(2, 4)"]
    answer: 2
    explain: "`predict_proba` renvoie une colonne **par classe**. Pour la classe positive : `[:, 1]`."
  - id: q-ml-fit-transform
    topic: scikit-learn
    question: "Sur le jeu de test, on appelle sur le StandardScaler…"
    choices: ["fit_transform", "fit puis transform", "transform uniquement", "inverse_transform"]
    answer: 2
    explain: "Le scaler a appris moyenne et écart-type sur le train : on les **réapplique** au test avec `transform`."
  - id: q-ml-kmeans
    topic: Non supervisé
    question: "k-means peut donner des résultats différents d'une exécution à l'autre parce que…"
    choices: ["Il est stochastique à chaque itération", "Il converge vers un minimum local qui dépend de l'initialisation", "Il trie les points aléatoirement", "Il utilise du dropout"]
    answer: 1
    explain: "D'où `n_init` (plusieurs initialisations, on garde la meilleure inertie) et l'initialisation k-means++."
  - id: q-ml-r2-negative
    topic: Métriques
    question: "Un R² négatif sur le test signifie…"
    choices: ["Une erreur de calcul", "Le modèle est pire que prédire la moyenne", "Le modèle est parfait", "Les données sont standardisées"]
    answer: 1
    explain: "R² = 1 − SS_res / SS_tot. Si les erreurs du modèle dépassent celles de la moyenne constante, R² < 0."
  - id: q-ml-stratify
    topic: Validation
    question: "Pourquoi `train_test_split(X, y, stratify=y)` sur un problème de fraude à 1 % ?"
    choices:
      - "Pour mélanger les données"
      - "Pour garder 1 % de fraudes dans le train et dans le test"
      - "Pour équilibrer les classes à 50/50"
      - "Pour accélérer l'entraînement"
    answer: 1
    explain: "Sans stratification, le test peut contenir trop peu (voire aucune) fraude et les métriques deviennent instables. `stratify` ne rééquilibre pas : il conserve les proportions."
  - id: q-ml-tree-scaling
    topic: Prétraitement
    question: "Quel modèle n'a **pas** besoin de standardiser les features ?"
    choices: ["k plus proches voisins", "Régression logistique régularisée", "Random forest", "SVM à noyau RBF"]
    answer: 2
    explain: "Les arbres coupent sur des seuils d'une feature à la fois : une transformation monotone (comme l'échelle) ne change pas les splits. kNN, SVM et modèles régularisés dépendent des distances ou de la norme des poids."
  - id: q-ml-onehot-trees
    topic: Prétraitement
    question: "Une feature `ville` a 5 000 modalités. Quel encodage éviter pour une régression logistique ?"
    choices: ["One-hot sans précaution (5 000 colonnes creuses, risque de sur-apprentissage des villes rares)", "Regrouper les villes rares dans « autre »", "Target encoding calculé dans la validation croisée", "Embeddings appris"]
    answer: 0
    explain: "Un one-hot de très haute cardinalité crée beaucoup de colonnes vues une ou deux fois. On regroupe les modalités rares, ou on utilise un target encoding **sans fuite** (calculé sur les folds d'entraînement)."
  - id: q-ml-gradient-boosting
    topic: Modèles
    question: "Différence entre random forest et gradient boosting ?"
    choices:
      - "Aucune, ce sont deux noms du même algorithme"
      - "La forêt moyenne des arbres profonds indépendants (réduit la variance) ; le boosting ajoute des arbres peu profonds qui corrigent les erreurs des précédents (réduit le biais)"
      - "Le boosting n'utilise pas d'arbres"
      - "La forêt est séquentielle, le boosting parallèle"
    answer: 1
    explain: "Bagging (forêt) : arbres en parallèle sur des échantillons bootstrap. Boosting (XGBoost, LightGBM) : arbres en série sur les résidus. Le boosting est souvent le plus performant sur des données tabulaires, mais plus sensible aux hyperparamètres."
  - id: q-ml-precision-recall-tradeoff
    topic: Métriques
    question: "On baisse le seuil de décision d'un classifieur de 0,5 à 0,2. En général…"
    choices: ["precision ↑, recall ↓", "precision ↓, recall ↑", "les deux augmentent", "rien ne change pour l'AUC… ni pour la precision"]
    answer: 1
    explain: "Plus de prédictions positives : on rattrape plus de vrais positifs (recall ↑) mais avec plus de fausses alertes (precision ↓). L'AUC, elle, ne dépend pas du seuil."
  - id: q-ml-cv-score-sklearn
    topic: scikit-learn
    verify: true
    question: Qu'affiche ce code ?
    code: |
      from sklearn.datasets import load_iris
      from sklearn.model_selection import cross_val_score
      from sklearn.tree import DecisionTreeClassifier
      X, y = load_iris(return_X_y=True)
      scores = cross_val_score(DecisionTreeClassifier(random_state=0), X, y, cv=5)
      print(scores.shape, type(scores).__name__)
    choices: ["(5,) ndarray", "() float", "(5,) list", "(150,) ndarray"]
    answer: 0
    explain: "`cross_val_score` renvoie **un score par fold**. On rapporte la moyenne **et** l'écart-type : `scores.mean(), scores.std()`."
  - id: q-ml-fit-on-test
    topic: Fuite de données
    question: "Quelle pratique crée une fuite de données ?"
    choices:
      - "Ajuster un StandardScaler sur tout le dataset avant le train_test_split"
      - "Mettre le scaler dans un Pipeline évalué par validation croisée"
      - "Choisir les hyperparamètres sur un jeu de validation"
      - "Garder un jeu de test intouché jusqu'à la fin"
    answer: 0
    explain: "La moyenne et l'écart-type incluent alors des informations du test. Le Pipeline garantit que chaque étape est ajustée sur les seuls folds d'entraînement."
  - id: q-ml-pca
    topic: Non supervisé
    question: "Que fait une ACP (PCA) ?"
    choices:
      - "Elle sélectionne les features les plus corrélées à la cible"
      - "Elle projette les données sur les directions de plus grande variance, sans utiliser la cible"
      - "Elle regroupe les points en clusters"
      - "Elle normalise chaque feature entre 0 et 1"
    answer: 1
    explain: "L'ACP est non supervisée : les composantes maximisent la variance expliquée. Il faut standardiser avant, sinon les features de grande échelle dominent."
  - id: q-ml-baseline
    topic: Méthode
    question: "Premier modèle à entraîner sur un nouveau problème de classification ?"
    choices: ["Un réseau de neurones profond", "Une baseline simple (classe majoritaire, puis régression logistique)", "Un ensemble de 10 modèles", "XGBoost avec une recherche d'hyperparamètres de 12 h"]
    answer: 1
    explain: "La baseline fixe le niveau à battre et vérifie le pipeline de bout en bout. Si un modèle complexe ne la bat pas nettement, il ne vaut pas sa complexité."
