id: numpy
title: NumPy
domain: numpy
setup: |
  import numpy as np
sections:
  - title: Créer des tableaux
    entries:
      - name: np.array
        signature: np.array(object, dtype=None)
        description: "Crée un ndarray à partir d'une liste (imbriquée). Tous les éléments ont le **même type** (`dtype`)."
        example: |
          a = np.array([[1, 2, 3], [4, 5, 6]])
          a.shape, a.ndim, a.dtype, a.size
      - name: np.zeros / ones / full / empty
        signature: np.zeros(shape, dtype=float) · np.full(shape, value) · np.zeros_like(a)
        description: "Tableaux remplis. La shape est un **tuple** : `np.zeros((3, 4))`. Les variantes `_like` reprennent la shape et le dtype d'un tableau existant."
        example: |
          np.zeros((2, 3)), np.full((2, 2), 7), np.ones_like(np.arange(3))
      - name: np.arange / linspace
        signature: np.arange(start, stop, step) · np.linspace(start, stop, num)
        description: "`arange` : pas fixe, `stop` **exclu**. `linspace` : nombre de points fixe, `stop` **inclus**."
        example: |
          np.arange(0, 10, 3), np.linspace(0, 1, 5)
      - name: np.eye / diag
        signature: np.eye(n) · np.diag(v)
        description: "Matrice identité ; `diag` crée une matrice diagonale (ou extrait la diagonale d'une matrice)."
        example: |
          np.eye(3), np.diag([1, 2, 3]), np.diag(np.arange(9).reshape(3, 3))
      - name: np.random.default_rng
        signature: rng = np.random.default_rng(seed) · rng.normal · integers · uniform · choice · permutation
        description: "Générateur aléatoire moderne et reproductible. Préfère-le à `np.random.seed`."
        example: |
          rng = np.random.default_rng(0)
          rng.normal(0, 1, size=3), rng.integers(0, 10, size=4), rng.choice(['a', 'b', 'c'], size=2, replace=False), rng.permutation(5)
      - name: astype
        signature: a.astype(dtype)
        description: "Convertit le type (crée une copie). Attention : affecter un float dans un tableau d'entiers **tronque** silencieusement."
        example: |
          a = np.array([1.7, 2.2, -0.5])
          a.astype(int), a.astype(np.float32).dtype, (a > 0).astype(int)
  - title: Shapes
    entries:
      - name: reshape
        signature: a.reshape(shape) · -1 = « déduis cette dimension »
        description: "Relit les mêmes données dans une autre shape (ordre ligne par ligne). Le nombre total d'éléments doit être conservé."
        example: |
          a = np.arange(12)
          a.reshape(3, 4), a.reshape(2, -1).shape, a.reshape(-1, 1).shape
      - name: None / np.newaxis / expand_dims / squeeze
        signature: "a[:, None] · np.expand_dims(a, axis) · a.squeeze()"
        description: "Ajouter un axe de taille 1 (piloter le broadcasting) ou retirer les axes de taille 1."
        example: |
          v = np.array([1, 2, 3])
          v[:, None].shape, v[None, :].shape, np.zeros((1, 3, 1)).squeeze().shape
      - name: transpose / .T / swapaxes
        signature: a.T · a.transpose(axes) · np.moveaxis(a, src, dst)
        description: "Échange les axes (≠ reshape !). Passer des images de `(N, H, W, C)` à `(N, C, H, W)` : `transpose(0, 3, 1, 2)`."
        example: |
          imgs = np.zeros((8, 32, 32, 3))
          np.arange(6).reshape(2, 3).T, imgs.transpose(0, 3, 1, 2).shape
      - name: concatenate / stack / vstack / hstack
        signature: np.concatenate(arrays, axis=0) · np.stack(arrays, axis=0)
        description: "`concatenate` colle le long d'un axe **existant** ; `stack` crée un **nouvel** axe."
        example: |
          a, b = np.ones((2, 3)), np.zeros((2, 3))
          np.concatenate([a, b]).shape, np.concatenate([a, b], axis=1).shape, np.stack([a, b]).shape, np.column_stack([a[:, 0], b[:, 0]]).shape
      - name: flatten / ravel
        signature: a.flatten() · a.ravel() · a.reshape(len(a), -1)
        description: "Aplatir en 1D (`flatten` copie, `ravel` renvoie une vue si possible). Pour un batch : `x.reshape(len(x), -1)`."
        example: |
          x = np.zeros((8, 3, 4, 4))
          np.arange(6).reshape(2, 3).ravel(), x.reshape(len(x), -1).shape
  - title: Indexation
    entries:
      - name: indexation et slicing
        signature: "a[i, j] · a[start:stop, :] · a[:, -1]"
        description: "Un indice par axe, séparés par des virgules. Le slicing renvoie une **vue** (modifier la tranche modifie l'original)."
        example: |
          a = np.arange(12).reshape(3, 4)
          a[1, 2], a[0], a[:, 1], a[1:, ::2]
      - name: masques booléens
        signature: "a[a > 0] · (c1) & (c2) · | · ~"
        description: "Filtrer avec une condition. Combiner avec `&`, `|`, `~` et **des parenthèses** (pas `and`/`or`)."
        example: |
          a = np.array([-2, 5, 0, 8, -1])
          a[a > 0], a[(a > -2) & (a < 6)], (a > 0).sum(), (a > 0).mean()
      - name: fancy indexing
        signature: "a[[i1, i2]] · a[np.arange(n), idx]"
        description: "Indexer avec des tableaux d'entiers. Deux tableaux sélectionnent des **paires** (i, j). Renvoie une copie."
        example: |
          P = np.array([[0.1, 0.9], [0.8, 0.2], [0.3, 0.7]])
          y = np.array([1, 0, 1])
          P[[0, 2]], P[np.arange(3), y]
      - name: np.where
        signature: np.where(cond, x, y) · np.where(cond)
        description: "If/else élément par élément ; avec un seul argument, renvoie les indices où la condition est vraie."
        example: |
          a = np.array([-2, 3, -1, 4])
          np.where(a < 0, 0, a), np.where(a > 0)[0]
      - name: np.select / np.clip
        signature: np.select(condlist, choicelist, default) · np.clip(a, lo, hi)
        description: "`select` : if/elif/else vectorisé. `clip` : borner les valeurs."
        example: |
          x = np.array([5, 50, 500])
          np.select([x < 10, x < 100], ['petit', 'moyen'], default='grand'), np.clip(x, 10, 100)
      - name: take_along_axis
        signature: np.take_along_axis(a, idx, axis)
        description: "Récupère, ligne par ligne, les éléments aux indices d'un tableau (typiquement le résultat d'un `argsort`)."
        example: |
          S = np.array([[3, 9, 1], [7, 2, 8]])
          idx = np.argsort(-S, axis=1)[:, :2]
          idx, np.take_along_axis(S, idx, axis=1)
  - title: Calculs et réductions
    entries:
      - name: opérations élément par élément
        signature: "a + b · a * b · a ** 2 · np.exp · np.log · np.sqrt"
        description: "Les opérateurs et les *ufuncs* s'appliquent élément par élément, en C, sans boucle Python."
        example: |
          a = np.array([1., 2., 3.])
          a * 2, a ** 2, np.exp(a).round(2), np.sqrt(a).round(3)
      - name: sum / mean / std / max / min (axis)
        signature: a.sum(axis=None, keepdims=False) · a.mean(axis) · a.std(axis, ddof=0)
        description: "`axis=0` réduit les **lignes** (un résultat par colonne), `axis=1` réduit les colonnes. `keepdims=True` garde l'axe avec une taille 1."
        example: |
          X = np.arange(6).reshape(2, 3)
          X.sum(axis=0), X.sum(axis=1), X.mean(axis=1, keepdims=True), X.max()
      - name: argmax / argmin / argsort / sort
        signature: a.argmax(axis) · np.argsort(a, axis) · np.sort(a)
        description: "`arg*` renvoie des **indices**. Tri décroissant : `np.argsort(-a)` ou `[::-1]`."
        example: |
          P = np.array([[0.1, 0.7, 0.2], [0.5, 0.3, 0.2]])
          scores = np.array([3, 1, 2])
          P.argmax(axis=1), np.argsort(scores), np.sort(scores)[::-1]
      - name: cumsum / diff
        signature: np.cumsum(a) · np.diff(a)
        description: "Somme cumulée et différences successives (réciproques l'une de l'autre, à une constante près)."
        example: |
          a = np.array([1, 3, 6, 10])
          np.cumsum(a), np.diff(a)
      - name: unique / bincount
        signature: np.unique(a, return_counts=True) · np.bincount(int_array)
        description: "Valeurs uniques triées (et leurs effectifs) ; `bincount` compte les entiers 0..max."
        example: |
          labels = np.array([2, 0, 2, 1, 2])
          np.unique(labels, return_counts=True), np.bincount(labels)
      - name: NaN
        signature: np.nan · np.isnan · np.nanmean · np.nansum
        description: "`np.nan == np.nan` est faux : on teste avec `np.isnan`. Les fonctions `nan*` ignorent les NaN."
        example: |
          x = np.array([1., np.nan, 3.])
          np.isnan(x).sum(), x.mean(), np.nanmean(x)
      - name: allclose / isclose
        signature: np.allclose(a, b, rtol=1e-5, atol=1e-8)
        description: "Comparer des flottants avec une tolérance (jamais `==` sur des calculs flottants)."
        example: |
          np.array([0.1 + 0.2]) == 0.3, np.allclose(0.1 + 0.2, 0.3)
  - title: Broadcasting
    entries:
      - name: règles du broadcasting
        signature: shapes alignées à droite ; tailles égales ou 1
        description: "Deux tableaux se combinent si, axe par axe en partant de la droite, leurs tailles sont égales ou l'une vaut 1 (elle est « étirée »)."
        example: |
          X = np.arange(6.).reshape(3, 2)
          (X - X.mean(axis=0)).shape, (X / X.sum(axis=1, keepdims=True)).shape, (np.arange(3)[:, None] * np.arange(4)).shape
      - name: distances par paires
        signature: "A[:, None, :] - B[None, :, :]"
        description: "Toutes les différences entre deux ensembles de points : `(n, 1, d) - (1, m, d)` → `(n, m, d)`."
        example: |
          A = np.array([[0., 0.], [1., 1.]])
          B = np.array([[3., 4.], [0., 1.], [1., 0.]])
          np.sqrt(((A[:, None, :] - B[None, :, :]) ** 2).sum(axis=-1)).round(3)
  - title: Algèbre linéaire
    entries:
      - name: "@ / np.dot / np.matmul"
        signature: "A @ B"
        description: "Produit matriciel. `(n, k) @ (k, m)` → `(n, m)`. À ne pas confondre avec `*` (élément par élément)."
        example: |
          A = np.array([[1, 2], [3, 4]])
          A @ A, A * A, A @ np.array([1, 1])
      - name: np.linalg
        signature: norm · solve · lstsq · inv · eig · svd · det
        description: "Normes, résolution de systèmes, moindres carrés, valeurs propres, SVD. Préfère `solve`/`lstsq` à `inv`."
        example: |
          A = np.array([[3., 1.], [1., 2.]])
          b = np.array([9., 8.])
          np.linalg.solve(A, b), np.linalg.norm([3, 4]), np.linalg.eigvalsh(A).round(3)
      - name: np.outer / einsum
        signature: np.outer(u, v) · np.einsum('ij,jk->ik', A, B)
        description: "Produit extérieur ; `einsum` exprime n'importe quel produit tensoriel avec une notation d'indices."
        example: |
          u, v = np.array([1, 2]), np.array([10, 20, 30])
          A = np.arange(6).reshape(2, 3)
          np.outer(u, v), np.einsum('ij->j', A), np.einsum('ij,ij->i', A, A)
